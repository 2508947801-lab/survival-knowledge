<!DOCTYPE html>
<html lang="zh-CN" data-yara-theme="dawn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记账本 · Yara</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#7C5CFF; --primary-l:#F0EBFF; --ink:#1F2937; --sub:#4B5563;
  --border:#E8EDF4; --bg:#F7F9FC; --card:#fff;
  --income:#16a34a; --income-l:#ECFBF8; --expense:#E85D67; --expense-l:#FFF0F2;
  --warning:#F59E42; --warning-l:#FFF6E9;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
.app{max-width:820px;margin:0 auto;padding:18px 14px 60px;}

.hd{text-align:center;padding:14px 0 8px;}
.hd h1{font-size:1.45rem;font-weight:800;letter-spacing:.5px;}
.hd .sub{font-size:.72rem;color:var(--sub);letter-spacing:2px;margin-top:2px;}
.sync-tip{text-align:center;font-size:.7rem;color:var(--sub);margin:6px 0;}
.sync-tip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--income);margin-right:4px;vertical-align:1px;}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:13px;box-shadow:0 1px 3px rgba(15,23,42,.05);}
.card-title{font-size:.82rem;font-weight:700;color:var(--sub);margin-bottom:10px;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;}

/* month bar */
.monthbar{display:flex;align-items:center;gap:8px;justify-content:center;margin:12px 0;}
.mnav{width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:1rem;cursor:pointer;color:var(--ink);}
.mnav:hover{background:var(--primary-l);border-color:var(--primary);color:var(--primary);}
#monthPick{border:1px solid var(--border);border-radius:9px;padding:7px 12px;font-size:.9rem;font-family:inherit;font-weight:700;}

/* summary */
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.sum-cell{border-radius:11px;padding:10px 8px;text-align:center;background:var(--primary-l);}
.sum-cell .v{font-size:1.05rem;font-weight:800;}
.sum-cell .k{font-size:.66rem;color:var(--sub);margin-top:2px;}
.sum-cell.inc{background:var(--income-l);} .sum-cell.inc .v{color:var(--income);}
.sum-cell.exp{background:var(--expense-l);} .sum-cell.exp .v{color:var(--expense);}
.sum-cell.bal .v{color:var(--primary);}
.sum-cell.wk{background:var(--warning-l);} .sum-cell.wk .v{color:var(--warning);}

/* annual money overview + coach */
.annual-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
.annual-title{display:flex;align-items:center;gap:9px;min-width:0;}
.annual-logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0f766e,#34d399);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 8px 18px rgba(5,150,105,.18);}
.annual-title strong{display:block;font-size:.9rem;}.annual-title span,.annual-scope{display:block;color:var(--sub);font-size:.7rem;line-height:1.45}.annual-scope{text-align:right}
.annual-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.annual-cell{padding:11px 9px;border-radius:12px;background:#f8fafc;border:1px solid #edf2f7}.annual-cell .v{font-size:1rem;font-weight:850;line-height:1.3}.annual-cell .k{font-size:.66rem;color:var(--sub);margin-top:3px}.annual-cell.inc .v{color:var(--income)}.annual-cell.exp .v{color:var(--expense)}.annual-cell.net .v{color:var(--warning)}
.money-diagnosis{margin-top:11px;padding:10px 12px;border-radius:11px;background:var(--primary-l);color:#16665e;font-size:.75rem;line-height:1.65}.money-diagnosis.danger{background:var(--expense-l);color:#9f1239}.money-diagnosis.warn{background:var(--warning-l);color:#92400e}
.coach-status{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--border)}.coach-dot{width:12px;height:12px;border-radius:50%;background:var(--income);box-shadow:0 0 0 5px rgba(22,163,74,.10)}.coach-status.warn .coach-dot{background:var(--warning);box-shadow:0 0 0 5px rgba(217,119,6,.11)}.coach-status.danger .coach-dot{background:var(--expense);box-shadow:0 0 0 5px rgba(225,29,72,.11)}.coach-status strong{display:block;font-size:.86rem}.coach-status span{display:block;color:var(--sub);font-size:.7rem;margin-top:1px}.coach-advice{margin:11px 0 0;padding-left:1.1rem;color:#475569;font-size:.75rem;line-height:1.75}.plan-row{display:flex;align-items:end;gap:9px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--border)}.plan-row label{flex:1;color:var(--sub);font-size:.68rem}.plan-row input{display:block;width:100%;margin-top:3px;border:1px solid var(--border);border-radius:8px;padding:7px 9px}.plan-row button{border:0;border-radius:9px;background:var(--primary);color:#fff;padding:8px 12px;font-weight:700}
.deposit-summary{font-size:.75rem;color:var(--sub);margin-bottom:9px}.deposit-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:10px 4px;border-bottom:1px solid #f1f5f9}.deposit-item:last-child{border-bottom:0}.deposit-item strong{display:block;font-size:.84rem}.deposit-item span{display:block;color:var(--sub);font-size:.68rem;margin-top:2px}.deposit-value{text-align:right;font-size:.78rem;font-weight:800;color:var(--primary)}.deposit-actions{display:flex;gap:4px}.deposit-actions button{width:28px;height:28px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--sub)}

/* immutable source archive */
.source-policy{padding:10px 12px;border-radius:11px;background:linear-gradient(135deg,#ecfdf5,#f8fafc);border:1px solid rgba(5,150,105,.14);font-size:.72rem;color:#16665e;line-height:1.65;margin-bottom:10px}.source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.source-item{padding:11px;border:1px solid var(--border);border-radius:12px;background:#fff}.source-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.source-head strong{font-size:.84rem}.source-head span{font-size:.64rem;color:var(--sub);text-align:right}.source-file{margin:5px 0 8px;color:var(--sub);font-size:.67rem;word-break:break-all}.source-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.source-stat{padding:6px 4px;border-radius:8px;background:#f8fafc;text-align:center}.source-stat b{display:block;font-size:.72rem}.source-stat small{display:block;font-size:.58rem;color:var(--sub);margin-top:1px}.source-check{margin-top:7px;padding-top:6px;border-top:1px dashed var(--border);font-size:.61rem;color:#94a3b8;word-break:break-all}.source-empty{font-size:.76rem;color:var(--sub)}

/* budget */
.bud-row{margin-bottom:9px;}
.bud-row:last-child{margin-bottom:0;}
.bud-head{display:flex;justify-content:space-between;font-size:.76rem;margin-bottom:3px;}
.bud-head .over{color:var(--expense);font-weight:700;}
.bud-bar{height:8px;background:var(--border);border-radius:20px;overflow:hidden;}
.bud-bar .fill{height:100%;border-radius:20px;background:var(--primary);transition:width .3s;}
.bud-bar .fill.over{background:var(--expense);}
.bud-total{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;padding-top:8px;margin-top:6px;border-top:1px dashed var(--border);}
.alert{background:var(--expense-l);color:var(--expense);border-radius:9px;padding:7px 11px;font-size:.76rem;font-weight:600;margin-top:9px;}

/* charts */
.chart-box{position:relative;height:230px;}
.chart-box.sm{height:200px;}

/* goal */
.goal-prog{margin:6px 0 10px;}
.goal-bar{height:14px;background:var(--border);border-radius:20px;overflow:hidden;}
.goal-bar .fill{height:100%;background:linear-gradient(90deg,#059669,#34d399);border-radius:20px;transition:width .4s;}
.goal-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;}
.goal-stat{background:var(--primary-l);border-radius:10px;padding:8px 10px;}
.goal-stat .v{font-size:.95rem;font-weight:800;color:var(--primary);}
.goal-stat .k{font-size:.66rem;color:var(--sub);}
.goal-form{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.goal-form label{font-size:.68rem;color:var(--sub);display:block;margin-bottom:2px;}
.goal-form input{width:100%;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:.82rem;font-family:inherit;}
.goal-form input:focus{border-color:var(--primary);outline:none;}

/* add form */
.type-toggle{display:flex;gap:8px;margin-bottom:10px;}
.type-btn{flex:1;border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px;font-size:.88rem;font-weight:700;cursor:pointer;color:var(--sub);}
.type-btn.on.exp{background:var(--expense);border-color:var(--expense);color:#fff;}
.type-btn.on.inc{background:var(--income);border-color:var(--income);color:#fff;}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.add-grid .full{grid-column:1 / -1;}
.fld label{font-size:.68rem;color:var(--sub);display:block;margin-bottom:2px;}
.fld input,.fld select{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 10px;font-size:.86rem;font-family:inherit;background:#fff;}
.fld input:focus,.fld select:focus{border-color:var(--primary);outline:none;}
#fAmount{font-size:1.1rem;font-weight:800;}
.add-btn{grid-column:1 / -1;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:11px;font-size:.92rem;font-weight:700;cursor:pointer;}
.add-btn:hover{background:#6847F0;}

/* ledger */
.filter-row{display:flex;gap:8px;margin-bottom:10px;}
.filter-row select{flex:1;border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:.8rem;font-family:inherit;background:#fff;}
.import-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 11px;padding:10px 11px;border:1px dashed rgba(5,150,105,.32);border-radius:11px;background:linear-gradient(135deg,rgba(231,246,240,.88),rgba(255,255,255,.92));}
.import-copy{min-width:0;}
.import-copy strong{display:block;font-size:.78rem;color:var(--ink);}
.import-copy span{display:block;margin-top:1px;font-size:.68rem;color:var(--sub);line-height:1.45;}
.import-btn{flex:0 0 auto;border:1px solid rgba(5,150,105,.28);background:#fff;color:var(--primary);border-radius:9px;padding:7px 11px;font-size:.76rem;font-weight:750;font-family:inherit;cursor:pointer;}
.import-btn:hover{background:var(--primary);border-color:var(--primary);color:#fff;}
.tx{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #f1f5f9;}
.tx:last-child{border-bottom:none;}
.tx-ico{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:var(--primary-l);display:flex;align-items:center;justify-content:center;font-size:1rem;}
.tx-body{flex:1;min-width:0;}
.tx-cat{font-size:.86rem;font-weight:600;}
.tx-meta{font-size:.7rem;color:var(--sub);margin-top:1px;word-break:break-all;}
.tx-amt{font-size:.92rem;font-weight:800;white-space:nowrap;}
.tx-amt.exp{color:var(--expense);} .tx-amt.inc{color:var(--income);}
.tx .del{width:24px;height:24px;flex:0 0 24px;border:none;background:transparent;color:#cbd5e1;font-size:1rem;cursor:pointer;border-radius:6px;}
.tx .del:hover{background:#fee2e2;color:var(--expense);}
.empty{text-align:center;color:var(--sub);font-size:.82rem;padding:24px 10px;}

/* settings */
.set-toggle{cursor:pointer;user-select:none;}
.set-body{display:none;margin-top:10px;}
.set-body.open{display:block;}
.set-sec{margin-bottom:14px;}
.set-sec h4{font-size:.78rem;color:var(--sub);margin-bottom:6px;}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--primary-l);color:var(--primary);border-radius:20px;padding:3px 10px;font-size:.74rem;font-weight:600;}
.chip .x{cursor:pointer;font-weight:800;opacity:.6;}
.chip .x:hover{opacity:1;}
.add-line{display:flex;gap:7px;}
.add-line input{flex:1;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:.8rem;font-family:inherit;}
.add-line button{border:none;background:var(--primary);color:#fff;border-radius:8px;padding:7px 13px;font-size:.8rem;font-weight:700;cursor:pointer;}
.bud-set-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.8rem;}
.bud-set-row span{flex:1;}
.bud-set-row input{width:110px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:.8rem;font-family:inherit;}

.foot{text-align:center;font-size:.68rem;color:#94a3b8;margin-top:24px;letter-spacing:1px;}

@media(max-width:560px){
  .sum-grid{grid-template-columns:repeat(2,1fr);}
  .annual-grid{grid-template-columns:repeat(2,1fr)}
  .plan-row{align-items:stretch;flex-direction:column}.deposit-item{grid-template-columns:minmax(0,1fr) auto}.deposit-actions{grid-column:1/-1;justify-content:flex-end}
  .goal-form{grid-template-columns:1fr;}
  .import-row{align-items:flex-start;}
  .import-copy span{max-width:220px;}
  .source-grid{grid-template-columns:1fr}.source-stats{grid-template-columns:repeat(3,1fr)}
}
</style>
<link id="yaraSystemTheme" rel="stylesheet" href="../yara-system-theme.css?v=4.2">
<script src="../yara-runtime-config.js?v=1.0"></script>
<script src="../yara-module-ui.js?v=1.0"></script>
</head>
<body data-yara-module="finance">
<div class="app">
  <header class="hd">
    <div class="module-kicker"><span class="module-icon">¥</span><span>财务管理</span></div>
    <h1>记账本</h1>
    <p class="sub">DAILY LEDGER · YARA</p>
    <p class="sync-tip"><span class="dot"></span>本机数据已就绪 · 配置后可跨设备同步</p>
  </header>

  <div class="monthbar">
    <button class="mnav" id="prevMonth">←</button>
    <input type="month" id="monthPick">
    <button class="mnav" id="nextMonth">→</button>
  </div>

  <!-- 概览 -->
  <div class="card">
    <div class="card-title">收支概览</div>
    <div class="sum-grid" id="sumGrid"></div>
  </div>

  <!-- 年度总览：汇总截图直接进入年度口径，不伪装成单笔流水 -->
  <div class="card" id="annualCard" aria-live="polite">
    <div id="annualBody"></div>
  </div>

  <!-- 原始账单来源档案：只展示元数据；真实逐行来源保存在私密数据层 -->
  <div class="card" id="sourceArchiveCard" aria-live="polite">
    <div class="card-title">来源档案 <span style="font-weight:400;font-size:.68rem">原记录只读 · 分析另派生</span></div>
    <div id="sourceArchiveBody"></div>
  </div>

  <div class="card" id="moneyCoachCard">
    <div class="card-title">资金管家 <span style="font-weight:400;font-size:.68rem">判断超支 · 规划结余 · 控制节奏</span></div>
    <div id="moneyCoachBody"></div>
  </div>

  <!-- 预算 -->
  <div class="card" id="budgetCard">
    <div class="card-title">本月预算</div>
    <div id="budgetBody"></div>
  </div>

  <!-- 趋势图 -->
  <div class="card">
    <div class="card-title">近 6 个月收支趋势</div>
    <div class="chart-box"><canvas id="trendChart"></canvas></div>
  </div>

  <!-- 分类 + 账户 -->
  <div class="card">
    <div class="card-title">本月支出 · 按分类</div>
    <div class="chart-box sm"><canvas id="catChart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">本月支出 · 按支付方式</div>
    <div class="chart-box sm"><canvas id="acctChart"></canvas></div>
  </div>

  <!-- 定存规划；旧基金数据继续保留但不再展示 -->
  <div class="card">
    <div class="card-title">定存规划 <span style="font-weight:400;color:var(--sub);font-size:.7rem">先保流动性 · 到期梯队</span></div>
    <div class="deposit-summary" id="depositSummary"></div>
    <div id="depositList"></div>
    <div class="add-grid" style="margin-top:10px">
      <div class="fld full"><label>定存名称</label><input id="dName" type="text" maxlength="40" placeholder="如：招行 1 年期定存"></div>
      <div class="fld"><label>本金（元）</label><input id="dPrincipal" type="number" step="0.01" min="0" placeholder="0.00"></div>
      <div class="fld"><label>年利率（%）</label><input id="dRate" type="number" step="0.01" min="0" placeholder="以银行实际利率为准"></div>
      <div class="fld"><label>起存日期</label><input id="dStart" type="date"></div>
      <div class="fld"><label>期限（月）</label><input id="dMonths" type="number" min="1" max="120" placeholder="如 12"></div>
      <button class="add-btn" id="depositSaveBtn">＋ 添加定存计划</button>
    </div>
    <div style="font-size:.68rem;color:var(--sub);margin-top:9px">利息为规划估算，非银行保证收益；先留足应急资金。</div>
  </div>

  <!-- 财务目标 -->
  <div class="card">
    <div class="card-title">财务目标（3-5 年规划）</div>
    <div id="goalBody"></div>
  </div>

  <!-- 记一笔 -->
  <div class="card">
    <div class="card-title">记一笔</div>
    <div class="type-toggle">
      <button class="type-btn exp on" id="typeExp" data-type="expense">支出</button>
      <button class="type-btn inc" id="typeInc" data-type="income">收入</button>
    </div>
    <div class="add-grid">
      <div class="fld"><label>金额（元）</label><input id="fAmount" type="number" step="0.01" min="0" placeholder="0.00"></div>
      <div class="fld"><label>日期</label><input id="fDate" type="date"></div>
      <div class="fld"><label>分类</label><select id="fCategory"></select></div>
      <div class="fld"><label>支付方式</label><select id="fAccount"></select></div>
      <div class="fld full"><label>备注（可选）</label><input id="fNote" type="text" maxlength="60" placeholder="如：午饭、地铁、工资…"></div>
      <button class="add-btn" id="addBtn">＋ 记一笔</button>
    </div>
  </div>

  <!-- 流水 -->
  <div class="card">
    <div class="card-title">流水明细 <span id="txCount" style="color:var(--primary)"></span></div>
    <div class="filter-row">
      <select id="filterType">
        <option value="all">全部类型</option>
        <option value="expense">只看支出</option>
        <option value="income">只看收入</option>
      </select>
      <select id="filterCat"><option value="all">全部分类</option></select>
    </div>
    <div class="import-row">
      <div class="import-copy">
        <strong>批量导入流水</strong>
        <span>Yara 账本 JSON · 稳定 ID 去重 · 来源只读留档</span>
      </div>
      <button class="import-btn" id="importLedgerBtn" type="button">选择文件</button>
      <input id="ledgerImportFile" type="file" accept=".json,application/json" hidden>
    </div>
    <div id="txList"></div>
  </div>

  <!-- 设置 -->
  <div class="card">
    <div class="card-title set-toggle" id="setToggle">⚙️ 设置（分类 / 账户 / 预算） <span style="color:var(--primary)">▶</span></div>
    <div class="set-body" id="setBody"></div>
  </div>

  <div class="foot">Yara · 雅识教育 · 2026</div>
</div>

<script>
// ===== 记账本 =====
const LS_KEY = 'yara_ledger_v1';
const CAT_ICO = {'餐饮':'🍜','交通':'🚇','购物':'🛍️','居住':'🏠','娱乐':'🎮','医疗':'💊','教育':'📚','人情':'🧧','服饰':'👕','日用':'🧴','通讯':'📱','工资':'💰','奖金':'🎁','兼职':'💼','理财':'📈','红包':'🧧','退款':'↩️','其他':'📌'};
const PALETTE = ['#e11d48','#f59e0b','#059669','#3b82f6','#e85d8f','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16','#06b6d4','#a855f7'];

const DEFAULT_CATEGORIES = {
  expense: ['餐饮','交通','购物','居住','娱乐','医疗','教育','人情','服饰','日用','通讯','其他'],
  income: ['工资','奖金','兼职','理财','红包','退款','其他']
};
const DEFAULT_ACCOUNTS = ['支付宝','微信','银行卡','信用卡','美团月付','抖音月付','现金','其他'];

function defaultState(){
  return {
    version: 2,
    transactions: [], deletedIds: [],
    categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
    accounts: DEFAULT_ACCOUNTS.slice(),
    budgets: {},
    goal: { targetAmount:0, targetYear:0, currentSavings:0 },
    holdings: [], snapshots: [],
    yearSummaries: [], deposits: [], sourceRecords: [], sourceImports: [],
    financialPlan: { targetSavingsRate:20, emergencyMonths:6, updatedAt:'' }
  };
}

// ===== 云同步配置（Supabase，复用 yara_todo 表，行 id=ledger）=====
const SB_CONFIG = window.YaraRuntimeConfig ? window.YaraRuntimeConfig.supabase() : {url:'',anonKey:'',ready:false};
const SB_URL = SB_CONFIG.url;
const SB_KEY = SB_CONFIG.anonKey;
const SB_ROW = 'ledger';
const SB_POLL_MS = 15000;
let lastSync = 0, saveTimer = null;

let state = load();
let curType = 'expense';
let curMonth = preferredLedgerMonth(state);

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function money(n){ return (Math.round(n*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function preferredLedgerMonth(source){
  const current=todayStr().slice(0,7);
  const txs=(source&&source.transactions)||[];
  if(txs.some(function(tx){ return String(tx.date||'').slice(0,7)===current; })) return current;
  const months=txs.map(function(tx){ return String(tx.date||'').slice(0,7); })
    .filter(function(month){ return /^\d{4}-\d{2}$/.test(month); }).sort();
  return months.length?months[months.length-1]:current;
}

function load(){
  let s;
  try{ s=JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if(!s || !s.transactions) s = defaultState();
  return normalize(s);
}
function normalize(s){
  s.version=2;
  if(!s.transactions) s.transactions=[];
  if(!s.deletedIds) s.deletedIds=[];
  if(!s.categories) s.categories=JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  if(!s.categories.expense) s.categories.expense=DEFAULT_CATEGORIES.expense.slice();
  if(!s.categories.income) s.categories.income=DEFAULT_CATEGORIES.income.slice();
  if(!s.accounts) s.accounts=DEFAULT_ACCOUNTS.slice();
  if(!s.budgets) s.budgets={};
  if(!s.goal) s.goal={targetAmount:0,targetYear:0,currentSavings:0};
  if(!s.holdings) s.holdings=[];
  if(!s.snapshots) s.snapshots=[];
  if(!s.yearSummaries) s.yearSummaries=[];
  if(!s.deposits) s.deposits=[];
  if(!s.sourceRecords) s.sourceRecords=[];
  if(!s.sourceImports) s.sourceImports=[];
  if(!s.financialPlan) s.financialPlan={targetSavingsRate:20,emergencyMonths:6,updatedAt:''};
  if(!Number.isFinite(Number(s.financialPlan.targetSavingsRate))) s.financialPlan.targetSavingsRate=20;
  if(!Number.isFinite(Number(s.financialPlan.emergencyMonths))) s.financialPlan.emergencyMonths=6;
  return s;
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); scheduleCloudSave(); }

// ===== 本机私密年度汇总导入 =====
// 汇总截图进入 yearSummaries，不伪装成交易流水；因此年度视图可用，月度口径不被污染。
function loadPendingLocalYearSummary(){
  const isLocal=location.protocol==='file:' || location.hostname==='127.0.0.1' || location.hostname==='localhost';
  if(!isLocal) return;
  const loader=document.createElement('script');
  loader.src='../private-data/'+'ledger-year-pending-import.js?v='+Date.now();
  loader.onload=function(){
    const payload=window.YaraPendingLedgerYearImport;
    delete window.YaraPendingLedgerYearImport;
    loader.remove();
    if(!payload||payload.kind!=='yara-ledger-year-summary-import'||!Array.isArray(payload.yearSummaries)) return;
    const deleted=new Set(state.deletedIds||[]), byId={};
    state.yearSummaries.forEach(function(row){byId[row.id]=row;});
    let changed=0;
    payload.yearSummaries.forEach(function(raw){
      const row=validateYearSummary(raw);if(!row||deleted.has(row.id))return;
      if(!byId[row.id]||String(row.updatedAt)>String(byId[row.id].updatedAt||'')){byId[row.id]=row;changed++;}
    });
    if(!changed)return;
    state.yearSummaries=Object.keys(byId).map(function(id){return byId[id];}).sort(function(a,b){return String(b.endDate).localeCompare(String(a.endDate));});
    save();render();YaraModuleUI.notify('年度收支汇总已更新');
  };
  loader.onerror=function(){ loader.remove(); };
  document.head.appendChild(loader);
}
function validateYearSummary(raw){
  if(!raw||typeof raw!=='object')return null;
  const id=String(raw.id||'').trim(),year=Number(raw.year),income=Math.round(Number(raw.income)*100)/100,expense=Math.round(Number(raw.expense)*100)/100;
  if(!id||!year||!Number.isFinite(income)||!Number.isFinite(expense)||income<0||expense<0)return null;
  return{id:id,year:year,startDate:String(raw.startDate||year+'-01-01').slice(0,10),endDate:String(raw.endDate||year+'-12-31').slice(0,10),account:String(raw.account||'全部账户'),income:income,expense:expense,note:String(raw.note||''),updatedAt:raw.updatedAt||new Date().toISOString()};
}

// ===== 云同步（合并式：流水按 id 取并集，避免多端/代记互相覆盖）=====
function sbHeaders(extra){
  const h={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
  for(const k in (extra||{})) h[k]=extra[k];
  return h;
}
function cloudLoad(){
  if(!SB_CONFIG.ready) return Promise.resolve(null);
  return fetch(SB_URL+'/rest/v1/yara_todo?id=eq.'+SB_ROW+'&select=data,updated_at',{headers:sbHeaders()})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(rows){ return (rows&&rows.length)?rows[0]:null; })
    .catch(function(){ return null; });
}
function cloudSave(){
  if(!SB_CONFIG.ready) return Promise.resolve(false);
  const iso=new Date().toISOString();
  return fetch(SB_URL+'/rest/v1/yara_todo',{
    method:'POST', headers:sbHeaders({'Prefer':'resolution=merge-duplicates'}),
    body:JSON.stringify({id:SB_ROW, data:state, updated_at:iso})
  }).then(function(r){ if(r.ok){ lastSync=Date.parse(iso); } return r.ok; }).catch(function(){ return false; });
}
function scheduleCloudSave(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(function(){ cloudSave(); },600); }
function sig(s){
  return s.transactions.length+':'+s.transactions.map(function(t){return t.id;}).sort().join(',')
    + '|h:'+(s.holdings||[]).map(function(h){return h.id+':'+h.value;}).sort().join(',')
    + '|s:'+(s.snapshots||[]).map(function(x){return x.id+':'+x.value;}).sort().join(',')
    + '|y:'+(s.yearSummaries||[]).map(function(x){return x.id+':'+x.updatedAt;}).sort().join(',')
    + '|d:'+(s.deposits||[]).map(function(x){return x.id+':'+x.updatedAt;}).sort().join(',')
    + '|sr:'+(s.sourceRecords||[]).map(function(x){return x.id;}).sort().join(',')
    + '|si:'+(s.sourceImports||[]).map(function(x){return x.id+':'+x.updatedAt+':'+x.checksum;}).sort().join(',')
    + '|p:'+JSON.stringify(s.financialPlan||{});
}
function unionArr(a,b){ const set=new Set(a); (b||[]).forEach(function(x){ set.add(x); }); return Array.from(set); }
function sortTx(){ state.transactions.sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.created||0)-(a.created||0); }); }
function mergeUpdatedRows(localRows,cloudRows,delSet){
  const byId={};
  (localRows||[]).concat(cloudRows||[]).forEach(function(row){
    if(!row||!row.id||delSet.has(row.id))return;
    if(!byId[row.id]||String(row.updatedAt||'')>String(byId[row.id].updatedAt||''))byId[row.id]=row;
  });
  return Object.keys(byId).map(function(id){return byId[id];});
}

function adoptCloud(row){
  const cloud=row.data;
  const before=sig(state);
  if(cloud){
    const delSet=new Set(state.deletedIds);
    (cloud.deletedIds||[]).forEach(function(id){ delSet.add(id); });
    const byId={};
    state.transactions.forEach(function(t){ byId[t.id]=t; });
    (cloud.transactions||[]).forEach(function(t){ byId[t.id]=t; });
    state.transactions=Object.keys(byId).map(function(k){ return byId[k]; }).filter(function(t){ return !delSet.has(t.id); });
    state.deletedIds=Array.from(delSet);
    // 合并持仓（按 id 取并集）
    const hById={};
    state.holdings.forEach(function(h){ hById[h.id]=h; });
    (cloud.holdings||[]).forEach(function(h){ hById[h.id]=h; });
    state.holdings=Object.keys(hById).map(function(k){ return hById[k]; }).filter(function(h){ return !delSet.has(h.id); });
    // 合并市值快照（id 含日期，天然按日去重）
    const sById={};
    state.snapshots.forEach(function(x){ sById[x.id]=x; });
    (cloud.snapshots||[]).forEach(function(x){ sById[x.id]=x; });
    state.snapshots=Object.keys(sById).map(function(k){ return sById[k]; }).filter(function(x){ return !delSet.has(x.id); }).sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
    state.yearSummaries=mergeUpdatedRows(state.yearSummaries,cloud.yearSummaries,delSet).sort(function(a,b){return String(b.endDate||'').localeCompare(String(a.endDate||''));});
    state.deposits=mergeUpdatedRows(state.deposits,cloud.deposits,delSet).sort(function(a,b){return String(a.maturityDate||'').localeCompare(String(b.maturityDate||''));});
    const sourceById={};
    (state.sourceRecords||[]).forEach(function(row){if(row&&row.id)sourceById[row.id]=row;});
    (cloud.sourceRecords||[]).forEach(function(row){if(row&&row.id&&!sourceById[row.id])sourceById[row.id]=row;});
    state.sourceRecords=Object.keys(sourceById).map(function(id){return sourceById[id];});
    state.sourceImports=mergeUpdatedRows(state.sourceImports,cloud.sourceImports,new Set()).sort(function(a,b){return String(b.periodEnd||'').localeCompare(String(a.periodEnd||''));});
    if(cloud.financialPlan&&String(cloud.financialPlan.updatedAt||'')>String((state.financialPlan||{}).updatedAt||'')) state.financialPlan=cloud.financialPlan;
    if(cloud.categories){
      state.categories.expense=unionArr(state.categories.expense, cloud.categories.expense);
      state.categories.income=unionArr(state.categories.income, cloud.categories.income);
    }
    state.accounts=unionArr(state.accounts, cloud.accounts);
    state.budgets=Object.assign({}, state.budgets, cloud.budgets||{});
    if(cloud.goal && cloud.goal.targetAmount) state.goal=cloud.goal;
    state.version=2;
    sortTx();
    if(!state.transactions.some(function(tx){ return String(tx.date||'').slice(0,7)===curMonth; })){
      curMonth=preferredLedgerMonth(state);
    }
  }
  const after=sig(state);
  lastSync=Date.parse(row.updated_at)||0;
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  render();
  if(before!==after) cloudSave();
}
function initCloud(){
  if(!SB_CONFIG.ready) return;
  cloudLoad().then(function(row){
    if(!row || !row.data){ cloudSave(); return; }
    if((Date.parse(row.updated_at)||0) > lastSync) adoptCloud(row);
  });
  setInterval(pollCloud, SB_POLL_MS);
}
function pollCloud(){
  cloudLoad().then(function(row){
    if(!row || !row.data) return;
    if((Date.parse(row.updated_at)||0) > lastSync) adoptCloud(row);
  });
}

// ===== 增删改 =====
function addTx(type, amount, date, category, account, note){
  amount=Math.round(parseFloat(amount)*100)/100;
  if(!amount || amount<=0) return false;
  state.transactions.unshift({
    id:'t'+Date.now()+Math.random().toString(36).slice(2,7),
    type:type, amount:amount, date:date||todayStr(),
    category:category||'其他', account:account||'其他', note:(note||'').trim(), created:Date.now()
  });
  sortTx(); save(); render(); YaraModuleUI.notify(type==='expense'?'支出记录已保存':'收入记录已保存');
  return true;
}
function validateImportTx(tx){
  if(!tx || typeof tx!=='object') return null;
  const type=tx.type==='income'?'income':tx.type==='expense'?'expense':'';
  const amount=Math.round(parseFloat(tx.amount)*100)/100;
  const date=String(tx.date||'').slice(0,10);
  const id=String(tx.id||'').trim();
  if(!id || !type || !amount || amount<=0 || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
  return Object.assign({}, tx, {
    id:id, type:type, amount:amount, date:date,
    category:String(tx.category||'其他').trim()||'其他',
    account:String(tx.account||'其他').trim()||'其他',
    note:String(tx.note||'').trim(),
    created:Number(tx.created)||Date.now()
  });
}
function validateSourceRecord(raw){
  if(!raw||typeof raw!=='object')return null;
  const id=String(raw.id||'').trim(),platform=String(raw.platform||'').trim(),sourceImportId=String(raw.sourceImportId||'').trim();
  if(!id||!platform||!sourceImportId||!raw.raw||typeof raw.raw!=='object')return null;
  return Object.assign({},raw,{id:id,platform:platform,sourceImportId:sourceImportId,sourceRow:Number(raw.sourceRow)||0,immutableSource:true});
}
function validateSourceImport(raw){
  if(!raw||typeof raw!=='object')return null;
  const id=String(raw.id||'').trim(),checksum=String(raw.checksum||'').trim();
  if(!id||!checksum||!Number.isFinite(Number(raw.rawRecordCount)))return null;
  return Object.assign({},raw,{id:id,checksum:checksum,rawRecordCount:Number(raw.rawRecordCount)||0,immutableSource:true,updatedAt:raw.updatedAt||new Date().toISOString()});
}
function prepareLedgerImport(payload){
  if(!payload || payload.kind!=='yara-ledger-import' || !Array.isArray(payload.transactions)){
    throw new Error('这不是有效的 Yara 账本导入文件');
  }
  const seen=new Set();
  const valid=[];
  let invalid=0;
  payload.transactions.forEach(function(raw){
    const tx=validateImportTx(raw);
    if(!tx || seen.has(tx.id)){ invalid++; return; }
    seen.add(tx.id); valid.push(tx);
  });
  const existing=new Set(state.transactions.map(function(tx){ return tx.id; }));
  const deleted=new Set(state.deletedIds||[]);
  const fresh=valid.filter(function(tx){ return !existing.has(tx.id) && !deleted.has(tx.id); });
  const sourceSeen=new Set(),validSourceRecords=[];let invalidSources=0;
  (payload.sourceRecords||[]).forEach(function(raw){const row=validateSourceRecord(raw);if(!row||sourceSeen.has(row.id)){invalidSources++;return;}sourceSeen.add(row.id);validSourceRecords.push(row);});
  const existingSources=new Set((state.sourceRecords||[]).map(function(row){return row.id;}));
  const freshSourceRecords=validSourceRecords.filter(function(row){return !existingSources.has(row.id);});
  const sourceImports=[];
  (payload.sourceImports||[]).forEach(function(raw){const row=validateSourceImport(raw);if(row)sourceImports.push(row);else invalidSources++;});
  const supersedeIds=Array.from(new Set((payload.supersedeIds||[]).map(function(id){return String(id||'').trim();}).filter(Boolean)));
  const supersedeExisting=supersedeIds.filter(function(id){return existing.has(id);});
  const importById={};(state.sourceImports||[]).forEach(function(row){importById[row.id]=row;});
  const updatedSourceImports=sourceImports.filter(function(row){return !importById[row.id]||String(row.updatedAt)>String(importById[row.id].updatedAt||'');});
  return {
    valid:valid, fresh:fresh, invalid:invalid,
    duplicate:valid.length-fresh.length,
    validSourceRecords:validSourceRecords,freshSourceRecords:freshSourceRecords,invalidSources:invalidSources,
    sourceImports:sourceImports,updatedSourceImports:updatedSourceImports,
    supersedeIds:supersedeIds,supersedeExisting:supersedeExisting,
    categories:payload.categories||{},
    accounts:Array.isArray(payload.accounts)?payload.accounts:[]
  };
}
function commitLedgerImport(batch){
  const hasChanges=batch.fresh.length||batch.freshSourceRecords.length||batch.updatedSourceImports.length||batch.supersedeExisting.length;
  if(!hasChanges) return {transactions:0,sourceRecords:0,sourceImports:0,superseded:0};
  const currentMonthWasEmpty=!state.transactions.some(function(tx){ return String(tx.date||'').slice(0,7)===curMonth; });
  const tombstones=new Set(state.deletedIds||[]);
  batch.supersedeIds.forEach(function(id){tombstones.add(id);});
  state.deletedIds=Array.from(tombstones);
  if(batch.supersedeIds.length){const supersedeSet=new Set(batch.supersedeIds);state.transactions=state.transactions.filter(function(tx){return !supersedeSet.has(tx.id);});}
  batch.fresh.forEach(function(tx){ state.transactions.push(tx); });
  batch.freshSourceRecords.forEach(function(row){state.sourceRecords.push(row);});
  const importsById={};(state.sourceImports||[]).forEach(function(row){importsById[row.id]=row;});
  batch.sourceImports.forEach(function(row){if(!importsById[row.id]||String(row.updatedAt)>String(importsById[row.id].updatedAt||''))importsById[row.id]=row;});
  state.sourceImports=Object.keys(importsById).map(function(id){return importsById[id];}).sort(function(a,b){return String(b.periodEnd||'').localeCompare(String(a.periodEnd||''));});
  state.categories.expense=unionArr(state.categories.expense, batch.categories.expense||[]);
  state.categories.income=unionArr(state.categories.income, batch.categories.income||[]);
  state.accounts=unionArr(state.accounts, batch.accounts);
  sortTx();
  if(currentMonthWasEmpty) curMonth=preferredLedgerMonth(state);
  save(); render();
  return {transactions:batch.fresh.length,sourceRecords:batch.freshSourceRecords.length,sourceImports:batch.updatedSourceImports.length,superseded:batch.supersedeExisting.length};
}
function loadPendingLocalLedgerImport(){
  const isLocal=location.protocol==='file:' || location.hostname==='127.0.0.1' || location.hostname==='localhost';
  if(!isLocal) return;
  const loader=document.createElement('script');
  loader.src='../private-data/'+'ledger-pending-import.js?v='+Date.now();
  loader.onload=function(){
    const payload=window.YaraPendingLedgerImport;
    delete window.YaraPendingLedgerImport;
    loader.remove();
    if(!payload) return;
    try{
      const batch=prepareLedgerImport(payload);
      if(!batch.fresh.length&&!batch.freshSourceRecords.length&&!batch.updatedSourceImports.length&&!batch.supersedeExisting.length)return;
      const result=commitLedgerImport(batch);
      YaraModuleUI.notify('账单已核验：新增 '+result.transactions+' 条会计流水、归档 '+result.sourceRecords+' 条原始记录'+(result.superseded?'，替换 '+result.superseded+' 条旧汇总':'') );
    }catch(error){
      YaraModuleUI.notify('本机账单自动导入失败，请改用“选择文件”导入','error');
    }
  };
  loader.onerror=function(){ loader.remove(); };
  document.head.appendChild(loader);
}
function delTx(id){
  const i=state.transactions.findIndex(function(x){ return x.id===id; });
  if(i>=0){
    state.deletedIds.push(id);
    state.transactions.splice(i,1);
    save(); render(); YaraModuleUI.notify('流水记录已删除');
  }
}

// ===== 定存规划（v2 增量字段；不改变旧 holdings / snapshots 语义） =====
let editDepositId=null;
function dateAddMonths(dateStr,months){
  const d=new Date((dateStr||todayStr())+'T00:00:00');const day=d.getDate();d.setMonth(d.getMonth()+Number(months||0));if(d.getDate()<day)d.setDate(0);return fmtDate(d);
}
function depositInterest(row){return (Number(row.principal)||0)*(Number(row.rate)||0)/100*(Number(row.termMonths)||0)/12;}
function saveDeposit(){
  const wasEditing=!!editDepositId;
  const name=document.getElementById('dName').value.trim();
  const principal=Math.round((Number(document.getElementById('dPrincipal').value)||0)*100)/100;
  const rate=Math.round((Number(document.getElementById('dRate').value)||0)*1000)/1000;
  const startDate=document.getElementById('dStart').value||todayStr();
  const termMonths=Math.round(Number(document.getElementById('dMonths').value)||0);
  if(!name||principal<=0||rate<0||termMonths<1){YaraModuleUI.notify('请完整填写定存名称、本金、利率和期限','warning');return;}
  const at=new Date().toISOString(),maturityDate=dateAddMonths(startDate,termMonths);
  if(editDepositId){const row=state.deposits.find(function(x){return x.id===editDepositId;});if(row)Object.assign(row,{name:name,principal:principal,rate:rate,startDate:startDate,termMonths:termMonths,maturityDate:maturityDate,updatedAt:at});}
  else state.deposits.push({id:'deposit-'+Date.now()+Math.random().toString(36).slice(2,6),name:name,principal:principal,rate:rate,startDate:startDate,termMonths:termMonths,maturityDate:maturityDate,createdAt:at,updatedAt:at});
  clearDepositForm();save();render();YaraModuleUI.notify(wasEditing?'定存计划已更新':'定存计划已添加');
}
function clearDepositForm(){editDepositId=null;['dName','dPrincipal','dRate','dMonths'].forEach(function(id){const el=document.getElementById(id);if(el)el.value='';});const start=document.getElementById('dStart');if(start)start.value=todayStr();const btn=document.getElementById('depositSaveBtn');if(btn)btn.textContent='＋ 添加定存计划';}
function editDeposit(id){const row=state.deposits.find(function(x){return x.id===id;});if(!row)return;editDepositId=id;document.getElementById('dName').value=row.name||'';document.getElementById('dPrincipal').value=row.principal||'';document.getElementById('dRate').value=row.rate||'';document.getElementById('dStart').value=row.startDate||todayStr();document.getElementById('dMonths').value=row.termMonths||'';document.getElementById('depositSaveBtn').textContent='✓ 保存定存修改';}
function deleteDeposit(id,control){const row=state.deposits.find(function(x){return x.id===id;});if(!row)return;YaraModuleUI.requestDelete(control,{title:'删除这条定存计划？',message:'删除后会同步到其他设备，但不会生成或删除任何真实银行交易。',confirmText:'确认删除'},function(){if(state.deletedIds.indexOf(id)<0)state.deletedIds.push(id);state.deposits=state.deposits.filter(function(x){return x.id!==id;});if(editDepositId===id)clearDepositForm();save();render();YaraModuleUI.notify('定存计划已删除');});}
function renderDeposits(){
  const rows=(state.deposits||[]).slice().sort(function(a,b){return String(a.maturityDate||'').localeCompare(String(b.maturityDate||''));});
  const principal=rows.reduce(function(total,row){return total+(Number(row.principal)||0);},0),interest=rows.reduce(function(total,row){return total+depositInterest(row);},0);
  document.getElementById('depositSummary').textContent=rows.length?'共 '+rows.length+' 笔计划 · 本金 '+money(principal)+' · 预计利息 '+money(interest):'还没有定存计划。建议先确认应急资金，再用分批到期的方式安排闲置现金。';

function txOfMonth(ym){ return state.transactions.filter(function(t){ return (t.date||'').slice(0,7)===ym; }); }
function sumBy(list,type){ return list.filter(function(t){return t.type===type;}).reduce(function(a,t){return a+t.amount;},0); }
function groupSum(list,type,key){
  const m={};
  list.filter(function(t){return t.type===type;}).forEach(function(t){ m[t[key]]=(m[t[key]]||0)+t.amount; });
  return m;
}
function weekExpense(){
  const d=new Date(); const day=d.getDay()||7;
  const mon=new Date(d); mon.setDate(d.getDate()-day+1);
  const start=fmtDate(mon), end=todayStr();
  return state.transactions.filter(function(t){ return t.type==='expense' && t.date>=start && t.date<=end; }).reduce(function(a,t){return a+t.amount;},0);
}
function monthList(n){
  const arr=[]; const d=new Date(); d.setDate(1);
  for(let i=n-1;i>=0;i--){ const x=new Date(d.getFullYear(),d.getMonth()-i,1); arr.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')); }
  return arr;
}
function avgMonthlyNet(){
  const ms={};
  state.transactions.forEach(function(t){ const ym=(t.date||'').slice(0,7); if(!ym) return; if(!ms[ym]) ms[ym]={i:0,e:0}; if(t.type==='income') ms[ym].i+=t.amount; else ms[ym].e+=t.amount; });
  const keys=Object.keys(ms);
  if(!keys.length) return 0;
  const total=keys.reduce(function(a,k){ return a+(ms[k].i-ms[k].e); },0);
  return total/keys.length;
}

function renderMoneyCoach(list,inc,exp){

function renderGoal(){

  const g=state.goal;
  const invest=totalValue();
  const net=(g.currentSavings||0)+invest;
  if(!g.targetAmount){
    body.innerHTML='<div style="font-size:.8rem;color:var(--sub);margin-bottom:8px">设定真实可执行的储蓄目标；定存计入现金，不重复计入总资产。</div>'+goalFormHtml();
    return;
  }
  const now=new Date();
  const monthsToTarget=Math.max(1,(g.targetYear-now.getFullYear())*12+(12-now.getMonth()));
  const gap=Math.max(0,g.targetAmount-net);
  const needPerMonth=gap/monthsToTarget;
  const pct=g.targetAmount? Math.min(100,Math.round(net/g.targetAmount*100)):0;
  const avg=avgMonthlyNet();
  let projText='—';
  if(avg>0){ const m=Math.ceil(gap/avg); const pd=new Date(now.getFullYear(),now.getMonth()+m,1); projText=pd.getFullYear()+'年'+(pd.getMonth()+1)+'月（约'+m+'个月）'; }
  else if(avg<=0){ projText='当前月均结余≤0，需先增加储蓄'; }
  body.innerHTML=
    '<div class="goal-prog"><div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:4px"><span>目标 '+money(g.targetAmount)+' · '+g.targetYear+'年</span><span style="color:var(--primary);font-weight:700">'+pct+'%</span></div>'+

    '</div>'+goalFormHtml();

    return '<div class="chip-list">'+arr.map(function(c){ return '<span class="chip">'+esc(c)+'<span class="x" data-kind="'+kind+'" data-val="'+esc(c)+'">×</span></span>'; }).join('')+'</div>';
  }
  let html='<div class="set-sec"><h4>支出分类</h4>'+chips(state.categories.expense,'expCat')+
    '<div class="add-line"><input id="newExpCat" placeholder="新增支出分类"><button data-add="expCat">添加</button></div></div>';
  html+='<div class="set-sec"><h4>收入分类</h4>'+chips(state.categories.income,'incCat')+
    '<div class="add-line"><input id="newIncCat" placeholder="新增收入分类"><button data-add="incCat">添加</button></div></div>';
  html+='<div class="set-sec"><h4>支付方式</h4>'+chips(state.accounts,'acct')+
    '<div class="add-line"><input id="newAcct" placeholder="新增支付方式"><button data-add="acct">添加</button></div></div>';
  html+='<div class="set-sec"><h4>月度预算（每个支出分类）</h4>'+
    state.categories.expense.map(function(c){ return '<div class="bud-set-row"><span>'+esc(c)+'</span><input type="number" min="0" data-bud="'+esc(c)+'" value="'+(state.budgets[c]||'')+'" placeholder="0 表示不设"></div>'; }).join('')+
    '<button class="add-btn" id="saveBudgets" style="margin-top:6px">保存预算</button></div>';
  body.innerHTML=html;
}

function renderCharts(){
  if(typeof Chart==='undefined') return;
  if(window.__charts){ Object.keys(window.__charts).forEach(function(k){ try{ window.__charts[k].destroy(); }catch(e){} }); }
  window.__charts={};
  const opts={ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ font:{size:11} } } } };
  // 趋势
  const ms=monthList(6);
  const incData=ms.map(function(m){ return Math.round(sumBy(txOfMonth(m),'income')); });
  const expData=ms.map(function(m){ return Math.round(sumBy(txOfMonth(m),'expense')); });
  window.__charts.trend=new Chart(document.getElementById('trendChart'),{
    type:'bar', data:{ labels:ms.map(function(m){ return m.slice(5)+'月'; }),
      datasets:[ {label:'收入',data:incData,backgroundColor:'#16a34a',borderRadius:4}, {label:'支出',data:expData,backgroundColor:'#e11d48',borderRadius:4} ]},
    options:opts });
  // 分类
  const list=txOfMonth(curMonth);
  const byCat=groupSum(list,'expense','category');
  const catKeys=Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; });
  if(catKeys.length){
    window.__charts.cat=new Chart(document.getElementById('catChart'),{
      type:'doughnut', data:{ labels:catKeys, datasets:[{data:catKeys.map(function(k){return Math.round(byCat[k]);}),backgroundColor:PALETTE}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10}}}}} });
  }
  // 账户
  const byAcct=groupSum(list,'expense','account');
  const acctKeys=Object.keys(byAcct).sort(function(a,b){ return byAcct[b]-byAcct[a]; });
  if(acctKeys.length){
    window.__charts.acct=new Chart(document.getElementById('acctChart'),{
      type:'bar', data:{ labels:acctKeys, datasets:[{label:'支出',data:acctKeys.map(function(k){return Math.round(byAcct[k]);}),backgroundColor:'#059669',borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}}} });
  }
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ===== EVENTS =====
function setType(t){
  curType=t;
  document.getElementById('typeExp').classList.toggle('on', t==='expense');
  document.getElementById('typeInc').classList.toggle('on', t==='income');
  renderFormOptions();
}
document.getElementById('typeExp').addEventListener('click',function(){ setType('expense'); });
document.getElementById('typeInc').addEventListener('click',function(){ setType('income'); });

document.getElementById('addBtn').addEventListener('click',function(){
  const ok=addTx(curType, document.getElementById('fAmount').value, document.getElementById('fDate').value,
    document.getElementById('fCategory').value, document.getElementById('fAccount').value, document.getElementById('fNote').value);
  if(ok){ document.getElementById('fAmount').value=''; document.getElementById('fNote').value=''; }

document.getElementById('prevMonth').addEventListener('click',function(){ shiftMonth(-1); });
document.getElementById('nextMonth').addEventListener('click',function(){ shiftMonth(1); });
document.getElementById('monthPick').addEventListener('change',function(e){ if(e.target.value){ curMonth=e.target.value; render(); } });
function shiftMonth(n){
  const p=curMonth.split('-'); let y=+p[0], m=+p[1]+n;
  if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
  curMonth=y+'-'+String(m).padStart(2,'0'); render();
}

document.getElementById('filterType').addEventListener('change',renderTxList);
document.getElementById('filterCat').addEventListener('change',renderTxList);
document.getElementById('importLedgerBtn').addEventListener('click',function(){
  document.getElementById('ledgerImportFile').click();
});
document.getElementById('ledgerImportFile').addEventListener('change',function(event){
  const input=event.currentTarget;
  const file=input.files&&input.files[0];
  if(!file) return;
  file.text().then(function(text){
    const payload=JSON.parse(text);
    const batch=prepareLedgerImport(payload);
    if(!batch.fresh.length&&!batch.freshSourceRecords.length&&!batch.updatedSourceImports.length&&!batch.supersedeExisting.length){
      YaraModuleUI.notify('没有需要更新的内容：流水和来源档案均已记录');
      return;
    }
    return YaraModuleUI.confirm({
      title:'导入并核验这份账单？',
      message:'将新增 '+batch.fresh.length+' 条会计流水、归档 '+batch.freshSourceRecords.length+' 条只读来源记录'+(batch.supersedeExisting.length?'，并用真实明细替换 '+batch.supersedeExisting.length+' 条旧汇总记录':'')+'。重复与已删除记录继续跳过；原始来源字段不会被分析结果覆盖。',
      confirmText:'确认导入',
      cancelText:'取消'
    }).then(function(confirmed){
      if(!confirmed) return;
      const result=commitLedgerImport(batch);
      YaraModuleUI.notify('已导入 '+result.transactions+' 条会计流水，来源档案同步完成');
    });
  }).catch(function(error){
    YaraModuleUI.notify(error&&error.message?error.message:'导入失败，请检查文件格式','error');
  }).finally(function(){ input.value=''; });
});

document.getElementById('txList').addEventListener('click',function(e){
  const tx=e.target.closest('.tx'); if(!tx) return;
  const act=e.target.closest('[data-act]'); if(!act) return;
  if(act.dataset.act==='del'){
    YaraModuleUI.requestDelete(act, {
      title:'删除这笔流水？',
      message:'删除后本月统计、预算和趋势图会同步更新到所有设备。',
      confirmText:'确认删除'
    }, function(){ delTx(tx.dataset.id); });
  }
});

  if(act.dataset.act==='dedit')editDeposit(item.dataset.id);

document.getElementById('moneyCoachBody').addEventListener('click',function(e){

  state.financialPlan={targetSavingsRate:Math.max(0,Math.min(90,Number(document.getElementById('targetSavingsRate').value)||20)),emergencyMonths:Math.max(1,Math.min(24,Number(document.getElementById('emergencyMonths').value)||6)),updatedAt:new Date().toISOString()};

document.getElementById('setToggle').addEventListener('click',function(){
  document.getElementById('setBody').classList.toggle('open');
});

// 设置区事件（事件委托，因 renderSettings 会重绘）
document.getElementById('setBody').addEventListener('click',function(e){
  const x=e.target.closest('.x');
  if(x){ removeItem(x.dataset.kind, x.dataset.val); return; }
  const add=e.target.closest('[data-add]');
  if(add){
    const kind=add.dataset.add;
    const inp=add.previousElementSibling;
    const v=(inp.value||'').trim(); if(!v) return;
    addItem(kind, v); inp.value=''; return;
  }
  if(e.target.id==='saveBudgets'){ saveBudgets(); }
  if(e.target.id==='saveGoal'){ saveGoal(); }
});
// goal 保存按钮也可能在 goalBody 里
document.getElementById('goalBody').addEventListener('click',function(e){
  if(e.target.id==='saveGoal'){ saveGoal(); }
});

function addItem(kind, v){
  if(kind==='expCat'){ if(state.categories.expense.indexOf(v)<0) state.categories.expense.push(v); }
  else if(kind==='incCat'){ if(state.categories.income.indexOf(v)<0) state.categories.income.push(v); }
  else if(kind==='acct'){ if(state.accounts.indexOf(v)<0) state.accounts.push(v); }
  save(); render();
}
function removeItem(kind, v){
  if(kind==='expCat'){ state.categories.expense=state.categories.expense.filter(function(c){return c!==v;}); }
  else if(kind==='incCat'){ state.categories.income=state.categories.income.filter(function(c){return c!==v;}); }
  else if(kind==='acct'){ state.accounts=state.accounts.filter(function(c){return c!==v;}); }
  save(); render();
}
function saveBudgets(){
  const inputs=document.querySelectorAll('[data-bud]');
  const b={};
  inputs.forEach(function(inp){ const v=parseFloat(inp.value); if(v>0) b[inp.dataset.bud]=v; });
  state.budgets=b; save(); render(); YaraModuleUI.notify('预算设置已保存');
}
function saveGoal(){
  state.goal={
    targetAmount:parseFloat(document.getElementById('gTarget').value)||0,
    targetYear:parseInt(document.getElementById('gYear').value)||0,
    currentSavings:parseFloat(document.getElementById('gSavings').value)||0
  };
  save(); render(); YaraModuleUI.notify('财务目标已保存');
}
