<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对账对比看板</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#f1f5f9; --surface3:#f5f6f8;
  --text:#1e293b; --text2:#64748b; --text3:#64748b;
  --border:#e2e8f0; --border2:#cbd5e1;
  --info:#2563eb; --infoBg:#eff3fa;
  --success:#16a34a; --successBg:#e9efe2;
  --warning:#d97706; --warningBg:#eff3fa;
  --danger:#dc2626; --dangerBg:#fee2e2;
  --purple:#7a6a9a; --purpleBg:#ece8f2;
  --radius:12px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px;padding:20px;padding-bottom:60px}
.wrap{max-width:1280px;margin:0 auto}
header{margin-bottom:16px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px}
h1{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;font-size:21px;font-weight:600;display:flex;align-items:center;gap:9px}
h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--info)}
.sub{color:var(--text2);font-size:12.5px;margin-top:5px}
.legend{font-size:12px;color:var(--text3)}
.legend b{color:var(--success)} .legend i{color:var(--warning);font-style:normal}

/* 期次 tabs */
.period-bar{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px;margin-bottom:14px}
.ptab{padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;font-weight:500;color:var(--text2);border:1px solid transparent;display:flex;align-items:center;gap:7px}
.ptab:hover{background:var(--surface2)}
.ptab.active{background:var(--infoBg);color:var(--info);border-color:#cbd5e1}
.ptab .badge{font-size:10.5px;background:var(--surface2);padding:1px 7px;border-radius:9px;color:var(--text3)}
.ptab.active .badge{background:#fff;color:var(--info)}

/* run selector */
.runbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px}
.runbar label{font-size:12.5px;color:var(--text2)}
.runbar select{font-size:13px;padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:#fff;color:var(--text);max-width:240px}
.arrow{color:var(--text3);font-size:16px}
.hint{font-size:12px;color:var(--warning)}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;position:relative;overflow:hidden}
.metric .lab{font-size:12px;color:var(--text2)}
.metric .num{font-size:26px;font-weight:600;margin-top:3px;letter-spacing:-.5px}
.metric .sub2{font-size:11.5px;color:var(--text3);margin-top:2px}
.metric.success .num{color:var(--success)} .metric.warn .num{color:var(--warning)}
.metric.danger .num{color:var(--danger)} .metric.info .num{color:var(--info)}
.metric.purple .num{color:var(--purple)}
.bar{height:6px;border-radius:4px;background:var(--surface2);margin-top:9px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:4px}
.bar.success > i{background:var(--success)} .bar.warn > i{background:var(--warning)}

/* trend */
.trend{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:14px}
.trend .tt{font-size:12px;color:var(--text2);margin-bottom:8px}
.trend .row{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:12px}
.trend .row .lbl{width:150px;color:var(--text3);flex-shrink:0}
.trend .track{flex:1;height:18px;background:var(--surface2);border-radius:5px;position:relative;overflow:hidden}
.trend .fill{position:absolute;left:0;top:0;height:100%;border-radius:5px}
.trend .fill.bind{background:linear-gradient(90deg,#16a34a,#7a9a6a)}
.trend .fill.conf{background:linear-gradient(90deg,#dc2626,#c06a5a)}
.trend .val{width:78px;text-align:right;color:var(--text2);flex-shrink:0}

/* sections */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.card > .hd{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.card > .hd h2{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:9px}
.card > .hd h2 .ic{width:9px;height:9px;border-radius:50%}
.card .cnt{font-size:12px;color:var(--text3);background:var(--surface2);padding:2px 9px;border-radius:10px}
.card .body{padding:0}
.card.collapsed .body{display:none}
.collapse-ic{color:var(--text3);font-size:13px;transition:transform .15s}
.card.collapsed .collapse-ic{transform:rotate(-90deg)}
.exp-btn{font-size:11px;color:var(--info);background:var(--infoBg);border:1px solid #cbd5e1;padding:3px 12px;border-radius:10px;cursor:pointer;font-weight:500;transition:all .12s;margin-left:8px;line-height:1.4}
.exp-btn:hover{background:var(--info);color:#fff}

.table-wrap{overflow:auto;max-height:460px;border-top:1px solid var(--border)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 11px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface3);font-weight:600;color:var(--text2);position:sticky;top:0;z-index:1}
tbody tr:hover{background:var(--surface3)}
td.mono,th.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--text2)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:500}
.pill.ok{background:var(--successBg);color:var(--success)}
.pill.no{background:var(--dangerBg);color:var(--danger)}
.pill.warn{background:var(--warningBg);color:var(--warning)}
.pill.mut{background:var(--surface2);color:var(--text3)}
.empty{padding:22px;text-align:center;color:var(--text3);font-size:13px}
.note{font-size:11.5px;color:var(--text3);padding:8px 18px 14px}
@media(max-width:640px){.metrics{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1><span class="dot"></span>对账对比看板</h1>
    <div class="sub">小鹅通学员账号异常 · 同期对比（保留每期每次跑数台账，追踪辅导老师合并/绑定进度）</div>
  </div>
  <div class="legend">绿色=<b>已处理(进度+)</b> &nbsp; 黄色=<i>仍待处理</i></div>
</header>

<div class="period-bar" id="periodTabs"></div>
<div class="runbar" id="runBar"></div>
<div id="content"></div>
</div>

    const b=it.b||{}, c=it.c||{}, kind=it.kind;
    if(kind==="news") return map.map(([,fn])=>quot(fn(c))).join(",");
    if(kind==="gone") return map.map(([,fn])=>quot(fn(b))).join(",");
    return map.map(([,fn])=>quot(fn(b,c))).join(",");
  }).join("\n");
  const csv = "\uFEFF"+hdr+"\n"+body;
  console.log("CSV 首行:", csv.split("\n")[0]);
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = state.period+"期_"+sectionId+".csv";
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ document.body.removeChild(a); }, 200);
  setTimeout(()=>{ URL.revokeObjectURL(url); }, 1000);
  console.log("导出完成:", a.download);
  } catch(e) {
    console.error("导出失败:", e);
    alert("导出出错: " + e.message + "\n请按 F12 打开控制台查看详情");
  }
}

function init(){
  const periods = Object.keys(DATA);
  if(!periods.length){
    $("#content").innerHTML = '<div class="empty">还没有任何台账快照。先跑一次对账（reconcile.py --period 期次）即可生成。</div>';
    return;
  }
  const tabs = $("#periodTabs");
  periods.forEach(p=>{
    const runs = DATA[p];
    const t=document.createElement("div");
    t.className="ptab"; t.dataset.p=p;
    t.innerHTML = `期次 ${p} <span class="badge">${runs.length} 轮</span>`;
    t.onclick=()=>selectPeriod(p);
    tabs.appendChild(t);
  });
  selectPeriod(periods[periods.length-1]); // 默认最新一期
}

function selectPeriod(p){
  state.period=p;
  const runs = DATA[p];
  state.base = 0;
  state.cur = runs.length-1;
  $$(".ptab").forEach(t=>t.classList.toggle("active", t.dataset.p===p));
  renderRunBar();
  render();
}

function renderRunBar(){
  const runs = DATA[state.period];
  const rb = $("#runBar");
  if(runs.length<2){
    rb.innerHTML = `<span class="hint">⚠ 本期只有 ${runs.length} 轮跑数，暂无可对比对象。等辅导老师操作一段时间后，用同样参数再跑一次（reconcile.py --period ${state.period} --run-label 辅导后复核），即可看进度。</span>`;
    return;
  }
  const opt = (i)=>`<option value="${i}">${runs[i].run_label} · ${runs[i].run_date}</option>`;
  rb.innerHTML = `
    <label>基线轮次</label>
    <select id="selBase">${runs.map((_,i)=>opt(i)).join("")}</select>
    <span class="arrow">→</span>
    <label>当前轮次</label>
    <select id="selCur">${runs.map((_,i)=>opt(i)).join("")}</select>
    <span class="hint" id="rbHint"></span>`;
  $("#selBase").value = state.base;
  $("#selCur").value = state.cur;
  $("#selBase").onchange = e=>{ state.base=+e.target.value; if(state.cur<=state.base) state.cur=Math.min(runs.length-1,state.base+1); $("#selCur").value=state.cur; render(); };
  $("#selCur").onchange = e=>{ state.cur=+e.target.value; if(state.base>=state.cur) state.base=Math.max(0,state.cur-1); $("#selBase").value=state.base; render(); };
}

function byUid(run){ const m={}; run.rows.forEach(r=>m[r["用户ID"]]=r); return m; }

function render(){
  const runs = DATA[state.period];
  const base = runs[state.base], cur = runs[state.cur];
  const bm = byUid(base), cm = byUid(cur);

  // 计算差异
  const bindProg=[], bindStill=[], mergeProg=[], mergeStill=[], news=[], gone=[];
  for(const uid in bm){
    const b=bm[uid];
    const c=cm[uid];
    if(b["绑定手机号"]==="N"){
      if(c && c["绑定手机号"]==="Y") bindProg.push(uid);
      else bindStill.push(uid);
    }
    if(b["是否冲突账号"]==="Y"){
      if(c && c["是否冲突账号"]==="N") mergeProg.push(uid);
      else mergeStill.push(uid);
    }
  }
  for(const uid in cm){ if(!(uid in bm)) news.push(uid); }
  for(const uid in bm){ if(!(uid in cm)) gone.push(uid); }

  // 存起来供导出使用
  state.res = { bindProg, bindStill, mergeProg, mergeStill, news, gone, bm, cm };

  const curBind = cur.rows.filter(r=>r["绑定手机号"]==="Y").length;
  const curUnbind = cur.rows.filter(r=>r["绑定手机号"]==="N").length;
  const curConf = cur.rows.filter(r=>r["是否冲突账号"]==="Y").length;
  const baseUnbind = base.rows.filter(r=>r["绑定手机号"]==="N").length;
  const baseConf = base.rows.filter(r=>r["是否冲突账号"]==="Y").length;

  // ---- 趋势（本期所有轮次）----
  const trend = runs.map(r=>({
    label:r.run_label,
    bind: pct(r.rows.filter(x=>x["绑定手机号"]==="Y").length, r.rows.length),
    conf: pct(r.rows.filter(x=>x["是否冲突账号"]==="Y").length, r.rows.length),
  }));

  // ---- 渲染 ----
  const bindRate = pct(bindProg.length, bindProg.length+bindStill.length);
  const mergeRate = pct(mergeProg.length, mergeProg.length+mergeStill.length);

  let html = "";
  // metrics
  html += `<div class="metrics">
    <div class="metric success"><div class="lab">绑定进度 (基线未绑→已绑)</div><div class="num">${bindProg.length}<small style="font-size:13px;color:var(--text3)"> / ${baseUnbind}</small></div><div class="sub2">${bindRate}% 已引导绑定</div><div class="bar success"><i style="width:${bindRate}%"></i></div></div>
    <div class="metric warn"><div class="lab">合并进度 (基线冲突→已解)</div><div class="num">${mergeProg.length}<small style="font-size:13px;color:var(--text3)"> / ${baseConf}</small></div><div class="sub2">${mergeRate}% 已合并</div><div class="bar warn"><i style="width:${mergeRate}%"></i></div></div>
    <div class="metric danger"><div class="lab">当前冲突账号(UID)</div><div class="num">${curConf}</div><div class="sub2">当前轮次仍有冲突</div></div>
    <div class="metric info"><div class="lab">当前未绑手机号</div><div class="num">${curUnbind}</div><div class="sub2">当前轮次待绑定</div></div>
    <div class="metric purple"><div class="lab">本期轮次</div><div class="num">${runs.length}</div><div class="sub2">${base.run_label} → ${cur.run_label}</div></div>
  </div>`;

  // trend
  if(trend.length>1){
    const maxv=100;
    html += `<div class="trend"><div class="tt">绑定率 / 冲突率 趋势（本期各轮次，绿=绑定率↑好，红=冲突率↓好）</div>`;
    trend.forEach((t,i)=>{
      html += `<div class="row"><div class="lbl">${i+1}. ${t.label}</div>
        <div class="track"><div class="fill bind" style="width:${t.bind}%"></div></div><div class="val">绑定 ${t.bind}%</div></div>
        <div class="row"><div class="lbl"></div>
        <div class="track"><div class="fill conf" style="width:${t.conf}%"></div></div><div class="val">冲突 ${t.conf}%</div></div>`;
    });
    html += `</div>`;
  }

  // 各明细 section
  html += section("bindProg","已绑手机号 (进度+)","ok", bindProg.map(u=>rowObj(bm[u],cm[u],"bind")),
    ["用户ID","昵称","客户名称","归属人","现已绑定手机号","线索原手机号"]);
  html += section("mergeProg","已合并账号 / 冲突已解 (进度+)","ok", mergeProg.map(u=>rowObj(bm[u],cm[u],"merge")),
    ["用户ID","客户名称","归属人","原冲突伙伴IDs","现是否冲突"]);
  html += section("bindStill","仍待绑定手机号","warn", bindStill.map(u=>rowObj(bm[u],cm[u],"bindStill")),
    ["用户ID","昵称","客户名称","归属人","线索手机号","账号类型","是否冲突"]);
  html += section("mergeStill","仍待合并账号 (冲突未解)","warn", mergeStill.map(u=>rowObj(bm[u],cm[u],"mergeStill")),
    ["用户ID","客户名称","归属人","冲突伙伴IDs","账号类型"]);
  html += section("news","新增账号 (本轮新出现)","mut", news.map(u=>rowObj(null,cm[u],"new")),
    ["用户ID","昵称","客户名称","归属人","绑定","冲突"]);
  html += section("gone","消失账号 (基线有/当前无)","mut", gone.map(u=>rowObj(bm[u],null,"gone")),
    ["用户ID","昵称","客户名称","归属人"]);

  if(runs.length<2){
    html = `<div class="empty" style="margin-top:10px">本期仅 1 轮跑数，下方为当前状态明细（同上加一轮次后即可显示进度对比）。</div>` + html;
  }

  $("#content").innerHTML = html;
  // 折叠
  $$(".card .hd").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("collapsed"));
  // 导出按钮
  $$(".exp-btn").forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation(); e.preventDefault();
      exportCSV(btn.dataset.export);
    });
  });
}

function rowObj(b,c,kind){
  // 统一返回一个用于渲染的对象，带必要字段
  return {b, c, kind};
}

function cell(uid,field,bm,cm){
  // 取基线或当前值
  if(bm && bm[uid] && bm[uid][field]!=="") return bm[uid][field];
  if(cm && cm[uid]) return cm[uid][field];
  return "";
}

function section(id,title,color,items,cols){
  const colors={"ok":"var(--success)","warn":"var(--warning)","mut":"var(--text3)","danger":"var(--danger)"};
  const c = colors[color]||"var(--text3)";
  let body;
  if(!items.length){
    body = `<div class="empty">无（本对比区间内没有此类账号）</div>`;
  } else {
    const head = `<tr>${cols.map(x=>`<th>${x}</th>`).join("")}</tr>`;
    const rows = items.map(it=>{
      const b=it.b, c=it.c, kind=it.kind, uid=(c||b)["用户ID"];
      const g=(f)=> (b&&b[f]!=="")?b[f] : (c?c[f]:"");
      const gNow=(f)=> c?c[f]:"";
      let tds="";
      for(const col of cols){
        let v="";
        if(col==="用户ID") v=`<span class="mono">${g("用户ID")}</span>`;
        else if(col==="昵称") v=g("昵称");
        else if(col==="客户名称") v=g("客户名称");
        else if(col==="归属人") v=g("归属人")||"—";
        else if(col==="账号类型") v=g("账号类型");
        else if(col==="线索手机号") v=`<span class="mono">${maskPh(g("线索手机号"))}</span>`||"—";
        else if(col==="线索原手机号") v=`<span class="mono">${maskPh(g("线索手机号"))}</span>`||"—";
        else if(col==="现已绑定手机号"){ const now=gNow("绑定手机号"); v = now==="Y"?`<span class="pill ok">已绑</span>`:`<span class="pill no">未绑</span>`; }
        else if(col==="原冲突伙伴IDs") v=`<span class="mono">${g("冲突伙伴IDs")||"—"}</span>`;
        else if(col==="冲突伙伴IDs") v=`<span class="mono">${g("冲突伙伴IDs")||"—"}</span>`;
        else if(col==="现是否冲突"){ const now=gNow("是否冲突账号"); v = now==="N"?`<span class="pill ok">已解</span>`:`<span class="pill no">仍冲突</span>`; }
        else if(col==="是否冲突"){ const vv=g("是否冲突账号"); v= vv==="Y"?`<span class="pill no">冲突</span>`:`<span class="pill ok">正常</span>`; }
        else if(col==="绑定"){ const vv=g("绑定手机号"); v= vv==="Y"?`<span class="pill ok">已绑</span>`:`<span class="pill no">未绑</span>`; }
        else if(col==="冲突"){ const vv=g("是否冲突账号"); v= vv==="Y"?`<span class="pill no">冲突</span>`:`<span class="pill ok">正常</span>`; }
        else v=g(col)||"—";
        tds+=`<td>${v}</td>`;
      }
      return `<tr>${tds}</tr>`;
    }).join("");
    body = `<div class="table-wrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  }
  return `<div class="card" id="card-${id}">
    <div class="hd"><h2><span class="ic" style="background:${c}"></span>${title}</h2><div style="display:flex;align-items:center;gap:6px"><span class="cnt">${items.length}</span>${items.length?`<button class="exp-btn" data-export="${id}" title="导出 CSV 文件，保留真实手机号">导出CSV</button>`:""}<span class="collapse-ic">▾</span></div></div>
    <div class="body">${body}</div>
  </div>`;
}

init();
</script>
</body>
</html>
