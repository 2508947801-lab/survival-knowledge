<!DOCTYPE html>
<html lang="zh-CN" data-yara-theme="dawn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能化教务管理系统 | Intelligent Academic Management System</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #7C5CFF; --primary-light: #F0EBFF; --primary-dark: #6847F0;
    --bg: #F7F9FC; --card-bg: #ffffff; --text: #1F2937; --text-secondary: #4B5563;
    --text-muted: #98A2B3; --border: #E8EDF4; --border-light: #EEF2F7;
    --shadow: 0 1px 3px 0 rgba(0,0,0,0.05), 0 1px 2px 0 rgba(0,0,0,0.03);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
    --radius: 12px; --radius-sm: 8px; --sidebar-w: 272px; --header-h: 64px;
    --success: #16a34a; --warning: #F59E42; --danger: #E85D67;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; min-height: 100vh; }
  body[data-yara-layout="flat"] .app { width: 100%; }
  body[data-yara-layout="flat"] .main { margin-left: 0 !important; width: 100% !important; max-width: none !important; }
  body[data-yara-layout="flat"] .topbar,
  body[data-yara-layout="flat"] .content { width: auto; max-width: none; }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w); background: var(--card-bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
    transition: transform 0.3s ease;
  }
  .sidebar-header {
    height: var(--header-h); display: flex; align-items: center; gap: 12px; padding: 0 20px;
    border-bottom: 1px solid var(--border-light); flex-shrink: 0;
  }
  .sidebar-logo {
    width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 18px; flex-shrink: 0;
  }
  .sidebar-title { line-height: 1.2; }
  .sidebar-title .zh { font-family: -apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif; font-size: 15px; font-weight: 700; color: var(--text); }
  .sidebar-title .en { font-size: 10px; color: var(--text-muted); letter-spacing: 0.3px; }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .sidebar-nav::-webkit-scrollbar { width: 4px; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .nav-group { margin-bottom: 8px; }
  .nav-group-label {
    font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.8px; padding: 12px 12px 6px; display: flex; align-items: center; gap: 6px;
  }
  .nav-group-label .dot { width: 6px; height: 6px; border-radius: 50%; }
  .nav-group-label.collapsible { cursor: pointer; user-select: none; transition: color 0.15s ease; }
  .nav-group-label.collapsible:hover { color: var(--text-secondary); }
  .nav-group-label .chevron { margin-left: auto; width: 14px; height: 14px; color: var(--text-muted); transition: transform 0.25s ease; flex-shrink: 0; }
  .nav-group-label.collapsed .chevron { transform: rotate(-90deg); }
  .nav-group-items { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.25s ease; }
  .nav-group-items.collapsed { grid-template-rows: 0fr; }
  .nav-group-items > .nav-group-inner { overflow: hidden; }
  .dot-blue { background: var(--primary); }
  .dot-green { background: var(--success); }
  .dot-amber { background: var(--warning); }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-sm);
    cursor: pointer; color: var(--text-secondary); font-size: 13px; transition: all 0.15s ease;
    margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; font-family: inherit;
  }
  .nav-item:hover { background: var(--border-light); color: var(--text); }
  .nav-item.active { background: var(--primary-light); color: var(--primary-dark); font-weight: 600; }
  .nav-item .nav-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .nav-item .nav-icon svg { width: 16px; height: 16px; }
  .nav-item .nav-text { flex: 1; }
  .nav-item .badge-count {
    font-size: 10px; background: var(--border-light); color: var(--text-muted);
    padding: 1px 6px; border-radius: 999px; font-weight: 500;
  }
  .nav-item.active .badge-count { background: rgba(154,123,79,0.15); color: var(--primary-dark); }
  .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border-light); flex-shrink: 0; }
  .sidebar-footer .user-info { display: flex; align-items: center; gap: 12px; }
  .sidebar-footer .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--primary-light); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0;
  }
  .sidebar-footer .user-name { font-size: 13px; font-weight: 600; }
  .sidebar-footer .user-role { font-size: 11px; color: var(--text-muted); }

  /* Main */
  .main { flex: 1; margin-left: 0; display: flex; flex-direction: column; min-height: 100vh; min-width: 0; }
  .topbar {
    height: var(--header-h); background: var(--card-bg); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .topbar-title { font-size: 18px; font-weight: 700; }
  .topbar-title .en { font-size: 12px; color: var(--text-muted); margin-left: 8px; font-weight: 400; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar-date { font-size: 13px; color: var(--text-secondary); }
  .content { flex: 1; padding: 32px; }

  /* Cards */
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .card-header { padding: 20px 24px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .card-header h3 { font-family: -apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif; font-size: 16px; font-weight: 700; }
  .card-header h3 .en { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 8px; }
  .card-body { padding: 24px; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
  body[data-academic-view="dashboard"] .stats-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  body[data-academic-view="dashboard"] .content { padding: 24px; }
  body[data-academic-view="dashboard"] .stats-grid { gap: 12px; margin-bottom: 22px; }
  body[data-academic-view="dashboard"] .stat-card { display:grid; grid-template-columns:38px minmax(0,1fr) auto; align-items:center; gap:12px; padding:14px 16px; border-radius:14px; }
  body[data-academic-view="dashboard"] .stat-card .stat-icon { width:38px; height:38px; margin:0; }
  body[data-academic-view="dashboard"] .stat-card .stat-value { margin:0; font-size:26px; }
  body[data-academic-view="dashboard"] .today-card { margin-bottom:22px!important; border-left:0; border-top:3px solid #4e997e; border-radius:16px; }
  body[data-academic-view="dashboard"] .today-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  body[data-academic-view="dashboard"] .today-item { min-width:0; border:1px solid var(--border-light); background:#fbfcfa; }
  .today-header-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 24px; transition: box-shadow 0.2s ease;
  }
  .stat-card:hover { box-shadow: var(--shadow-md); }
  .stat-card .stat-label { font-size: 13px; color: var(--text-secondary); }
  .stat-card .stat-label .en { font-size: 10px; color: var(--text-muted); display: block; margin-top: 2px; }
  .stat-card .stat-value { font-size: 32px; font-weight: 700; margin-top: 8px; color: var(--text); }
  .stat-card .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .stat-icon.blue { background: var(--primary-light); color: var(--primary); }
  .stat-icon.green { background: #e9efe2; color: var(--success); }
  .stat-icon.amber { background: #f5ecd9; color: var(--warning); }
  .stat-icon.red { background: #f5e3de; color: var(--danger); }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 12px 16px; background: var(--border-light); color: var(--text-secondary);
    font-weight: 600; font-size: 12px; white-space: nowrap; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 1;
  }
  thead th .en { display: block; font-size: 10px; color: var(--text-muted); font-weight: 400; margin-top: 1px; }
  tbody td { padding: 10px 16px; border-bottom: 1px solid var(--border-light); vertical-align: top; }
  tbody tr:hover { background: var(--border-light); }
  tbody tr:last-child td { border-bottom: none; }
  .chapter-row td { background: #f2eee4; font-weight: 700; color: var(--primary-dark); font-size: 13px; padding: 10px 16px; }
  .chapter-row:hover td { background: #eff3fa; }

  /* Badge */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-blue { background: var(--primary-light); color: var(--primary-dark); }
  .badge-green { background: #e9efe2; color: #4a6340; }
  .badge-amber { background: #f5ecd9; color: #8a6a2e; }
  .badge-red { background: #f5e3de; color: #8a3a2c; }
  .badge-gray { background: #f2eee4; color: #64748b; }

  /* Buttons & Inputs */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s ease; font-family: inherit; }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .input, .select { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; background: var(--card-bg); color: var(--text); outline: none; transition: border-color 0.15s ease; }
  .input:focus, .select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .search-box { position: relative; }
  .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .search-box .input { padding-left: 32px; width: 240px; }

  /* Project cards on dashboard */
  .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .project-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; cursor: pointer; transition: all 0.2s ease; }
  .project-card:hover { box-shadow: var(--shadow-md); border-color: var(--primary); transform: translateY(-2px); }
  .project-card .pc-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .project-card .pc-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #fff; }
  .project-card .pc-name { font-size: 16px; font-weight: 700; }
  .project-card .pc-name .en { font-size: 11px; color: var(--text-muted); font-weight: 400; display: block; }
  .project-card .pc-stats { display: flex; gap: 24px; }
  .project-card .pc-stat { text-align: center; }
  .project-card .pc-stat .val { font-size: 24px; font-weight: 700; color: var(--text); }
  .project-card .pc-stat .lbl { font-size: 11px; color: var(--text-muted); }
  .project-card .pc-periods { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  .project-card .pc-periods .tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: var(--border-light); color: var(--text-secondary); }
  body[data-academic-view="tools"] .content { padding-top: 24px; }
  .build-tool-hub { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 28px; }
  .build-tool-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
  .build-tool-head h2 { font-size: 22px; line-height: 1.25; margin-bottom: 6px; }
  .build-tool-head p { color: var(--text-secondary); font-size: 13px; }
  .build-tool-head .build-tool-rule { flex: 0 0 auto; color: var(--text-muted); font-size: 11px; text-align: right; }
  .build-tool-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .build-tool-option { min-width: 0; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--card-bg); color: var(--text); text-align: left; cursor: pointer; font-family: inherit; transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
  .build-tool-option:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .build-tool-option .tool-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: #fff; font-size: 18px; font-weight: 700; }
  .build-tool-option strong { display: block; font-size: 15px; line-height: 1.35; }
  .build-tool-option small { display: block; margin-top: 3px; color: var(--text-muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .build-tool-option .tool-arrow { color: var(--primary-dark); font-size: 18px; transition: transform .18s ease; }
  .build-tool-option:hover .tool-arrow { transform: translateX(3px); }

  /* Weekly course boards */
  .schedule-board-stack { display: grid; gap: 24px; margin-bottom: 32px; }
  .week-board-card .card-header { align-items: flex-start; }
  .week-board-subtitle { margin-top: 4px; color: var(--text-muted); font-size: 11px; }
  .week-board-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .week-range-label { min-width: 170px; text-align: center; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
  .week-calendar-wrap, .pattern-table-wrap { overflow-x: auto; scrollbar-width: thin; scroll-behavior: smooth; }
  .week-calendar { min-width: 1120px; display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); background: var(--border); gap: 1px; }
  .week-day { min-width: 0; background: var(--card-bg); }
  .week-day.is-today { background: linear-gradient(180deg, #eef8f3 0%, #fbfdfb 100%); box-shadow: inset 0 0 0 2px #55ad8e; }
  .week-day-head { min-height: 62px; padding: 11px 12px; background: #f7f5ef; border-bottom: 1px solid var(--border); }
  .week-day.is-today .week-day-head { background: #dff2e9; }
  .week-day-name { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; }
  .today-marker { color: #2f7b63; background: #fff; border: 1px solid #acd8c8; border-radius: 999px; padding: 1px 7px; font-size: 10px; }
  .week-day-date { margin-top: 3px; color: var(--text-muted); font-size: 11px; }
  .week-day-events { min-height: 180px; padding: 10px; display: grid; align-content: start; gap: 8px; }
  .week-event { border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: 10px; padding: 9px 10px; background: rgba(255,255,255,.88); box-shadow: 0 2px 8px rgba(80,70,50,.04); }
  .week-event.type-waijiao { border-left-color: #d97706; background: #fff9ef; }
  .week-event.type-jiuyin { border-left-color: #16a34a; background: #f4fbf6; }
  .week-event.type-yuliao { border-left-color: #7c3aed; background: #f8f5ff; }
  .week-event.type-shared { border-left-color: #6d5cc7; background: linear-gradient(135deg,#f4fbf7,#f7f3ff); }
  .week-event.type-dayi { border-left-color: #db5ca6; background: #fff5fb; }
  .week-event.type-daoxue { border-left-color: #64748b; background: #f8fafc; }
  .week-event-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .week-event-time { color: var(--text); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .week-event-project { margin-top: 6px; color: var(--text-secondary); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .week-event-title { margin-top: 3px; color: var(--text); font-size: 11px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .week-event-periods { display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; }
  .week-event-periods span { padding:2px 6px; border-radius:999px; background:#fff; border:1px solid rgba(109,92,199,.18); color:#5f54a5; font-size:9px; font-weight:700; }
  .board-detail-btn { margin-top:8px; padding:4px 8px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--primary-dark); font:700 10px/1.2 inherit; cursor:pointer; }
  .board-detail-btn:hover { border-color:var(--primary); box-shadow:0 4px 12px rgba(70,86,77,.08); }
  .week-empty { min-height: 150px; display: grid; place-items: center; color: #b3ada2; font-size: 11px; }
  .course-type-chip { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 2px 7px; background: var(--primary-light); color: var(--primary-dark); font-size: 10px; font-weight: 700; white-space: nowrap; }
  .course-type-chip.type-waijiao { background: #fff0d8; color: #9a5700; }
  .course-type-chip.type-jiuyin { background: #e7f6eb; color: #287444; }
  .course-type-chip.type-yuliao { background: #f0e9ff; color: #6d35bc; }
  .course-type-chip.type-shared { background:linear-gradient(135deg,#e5f5ec,#eee8ff); color:#5b4ca7; }
  .course-type-chip.type-dayi { background: #fde8f5; color: #a83d7f; }
  .course-type-chip.type-daoxue { background: #edf1f5; color: #526174; }
  .pattern-table { min-width: 1180px; table-layout: fixed; }
  .pattern-table th, .pattern-table td { text-align: left; vertical-align: top; }
  .pattern-table th:first-child, .pattern-table td:first-child { width: 190px; text-align: left; }
  .pattern-table th:nth-child(2), .pattern-table td:nth-child(2) { width: 155px; text-align: left; }
  .pattern-table th.is-today-col { background: #dff2e9; color: #2f6f5b; }
  .pattern-table td.is-today-col { background: #f1faf6; box-shadow: inset 2px 0 0 #78bfa8, inset -2px 0 0 #78bfa8; }
  .period-name { font-weight: 700; }
  .period-meta { margin-top: 3px; color: var(--text-muted); font-size: 10px; }
  .pattern-cell { display: grid; justify-items: start; gap: 5px; }
  .pattern-entry { width:100%; display: flex; align-items: center; justify-content: flex-start; gap: 5px; flex-wrap: wrap; }
  .pattern-entry .board-detail-btn { margin:0 0 0 auto; }
  .pattern-time { color: var(--text-secondary); font-size: 10px; font-variant-numeric: tabular-nums; }
  .period-status { display:inline-flex; margin-left:6px; padding:2px 7px; border-radius:999px; font-size:9px; font-weight:800; vertical-align:middle; }
  .period-status.is-finished { background:#edf0ed; color:#6a756e; }
  .pattern-rest { color: #b4aea3; font-size: 11px; }
  .intake-week-list { display: grid; gap: 5px; }
  .intake-week { display: block; width: fit-content; max-width: 100%; border-radius: 8px; padding: 4px 7px; background: #edf7f1; color: #34745e; font-size: 10px; line-height: 1.35; }
  .intake-week.is-current { background: #d5f0e2; box-shadow: inset 0 0 0 1px #77b99e; font-weight: 700; }
  .board-legend { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .board-note { margin-top: 12px; color: var(--text-muted); font-size: 11px; }

  /* Editable weekly-board detail layer */
  .board-detail-backdrop { position:fixed; z-index:9998; inset:0; display:flex; justify-content:flex-end; background:rgba(38,47,42,.3); backdrop-filter:blur(7px); opacity:0; visibility:hidden; transition:.22s ease; }
  .board-detail-backdrop.open { opacity:1; visibility:visible; }
  .board-detail-panel { width:min(620px,94vw); height:100%; overflow:auto; background:#fbfaf6; border-left:1px solid var(--border); box-shadow:-24px 0 70px rgba(35,46,40,.18); transform:translateX(40px); transition:.26s cubic-bezier(.22,.75,.24,1); }
  .board-detail-backdrop.open .board-detail-panel { transform:none; }

// ===== AUTO STATUS & TODAY HELPERS =====
// 根据行课时间自动判定状态：已过=已完成，今日=今日待上，未来=待上
function computeStatus(timeStr) {
  if (!timeStr || timeStr === '—') return { text: '—', cls: 'badge-gray' };
  const d = new Date(timeStr.replace(' ', 'T'));
  if (isNaN(d.getTime())) return { text: '—', cls: 'badge-gray' };
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const lessonDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (lessonDay < today) return { text: '已完成', cls: 'badge-green' };
  if (lessonDay.getTime() === today.getTime()) return { text: '今日待上', cls: 'badge-blue' };
  return { text: '待上', cls: 'badge-amber' };
}

// 汇总今天所有项目/期班的课程，按时间排序
function getTodayLessons() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const results = [];
  const yangShared = [];
  PROJECTS.forEach(p => {
    const periods = COURSE_DATA[p.dataKey];
    Object.keys(periods).forEach(period => {
      periods[period].forEach(l => {
        if (!l.time) return;
        const d = new Date(l.time.replace(' ', 'T'));
        if (isNaN(d.getTime())) return;
        const lessonDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        if (lessonDay.getTime() === today.getTime()) {
          const type = classifyLessonType(l.lesson);
          if (isYangSharedLesson(p, d, type)) {
            yangShared.push({ project:p, period, lesson:l, time:boardAtEight(d), type });
            return;
          }
          results.push({ project: p, period, lesson: l, time: d });
        }
      });
    });
  });
  if (yangShared.length) {
    results.push({
      project: yangShared[0].project,
      period: yangShared.map(item => item.period).sort((a,b) => a.localeCompare(b,'zh-CN')).join('、'),
      lesson: { lesson:'杨家成项目 · 纠音/语聊共同上课', lessonId:'', homeworkId:'' },
      time: new Date(yangShared[0].time),
      type: '纠音/语聊',
      shared: true,
      items: yangShared
    });
  }
  results.sort((a, b) => a.time - b.time);
  return results;
}

// ===== WEEKLY COURSE BOARD HELPERS =====
// 周表只派生展示主课表，不写回、不复制课程事实源。
const BOARD_DAYS = [
  { key:'mon', name:'周一' }, { key:'tue', name:'周二' }, { key:'wed', name:'周三' },
  { key:'thu', name:'周四' }, { key:'fri', name:'周五' }, { key:'sat', name:'周六' },
  { key:'sun', name:'周日' }
];
const BOARD_TYPE_CLASS = {
  '亲授':'qinshou', '外教':'waijiao', '纠音':'jiuyin', '语聊':'yuliao', '纠音/语聊':'shared', '答疑':'dayi', '导学':'daoxue'
};
let boardDetailRegistry = {};
let boardDetailSequence = 0;
let boardToastTimer = 0;

function boardEscape(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function boardParseTime(value) {
  if (!value) return null;
  const d = new Date(String(value).replace(' ', 'T'));
  return isNaN(d.getTime()) ? null : d;
}
function boardAddDays(date, amount) {
  const next = new Date(date);
  next.setDate(next.getDate() + amount);
  return next;
}
function boardStartOfWeek(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return d;
}
function boardDateKey(date) {
  return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
}
function boardShortDate(date) {
  return String(date.getMonth()+1).padStart(2,'0') + '/' + String(date.getDate()).padStart(2,'0');
}
function boardTimeText(date) {
  if (!date) return '';
  const hhmm = String(date.getHours()).padStart(2,'0') + ':' + String(date.getMinutes()).padStart(2,'0');
  return hhmm === '00:00' ? '时间待定' : hhmm;
}
function boardHasSpecificTime(date) {
  return !!date && (date.getHours() !== 0 || date.getMinutes() !== 0);
}
function boardAtEight(date) {
  const next = new Date(date);
  next.setHours(20, 0, 0, 0);
  return next;
}
function classifyLessonType(lessonName) {
  const name = String(lessonName || '');
  if (/外教|^\s*【外】|Talk About/i.test(name)) return '外教';
  if (/纠音/i.test(name)) return '纠音';
  if (/语聊|交流房/i.test(name)) return '语聊';
  if (/答疑/i.test(name)) return '答疑';
  if (/导学|学习指南/i.test(name)) return '导学';
  return '亲授';
}
function boardTypeClass(type) {
  return 'type-' + (BOARD_TYPE_CLASS[type] || 'qinshou');
}
function boardTypeChip(type) {
  return `<span class="course-type-chip ${boardTypeClass(type)}">${boardEscape(type)}</span>`;
}
function isYangSharedLesson(project, date, type) {
  return !!project && project.dataKey === '杨家成3980' && date && (type === '纠音' || type === '语聊');
}
function boardLessonRef(projectKey, period, lesson) {
  return { projectKey, period, id:lesson && lesson.id ? lesson.id : '' };
}
function registerBoardDetail(title, refs) {
  const key = 'board-detail-' + (++boardDetailSequence);
  const seen = new Set();
  boardDetailRegistry[key] = {
    title,
    refs:(refs || []).filter(ref => {
      const token = [ref.projectKey, ref.period, ref.id].join('::');
      if (!ref.id || seen.has(token)) return false;
      seen.add(token);
      return true;
    })
  };
  return key;
}
function boardDetailButton(key, count) {
  return `<button class="board-detail-btn" type="button" onclick="openBoardDetail('${boardEscape(key)}')">明细${count ? ` · ${count}` : ''}</button>`;
}
function collectWeekEvents(monday) {
  const buckets = Array.from({length:7}, () => []);
  const startKey = boardDateKey(monday);
  const endKey = boardDateKey(boardAddDays(monday, 6));
  PROJECTS.forEach(project => {
    const periods = COURSE_DATA[project.dataKey] || {};
    Object.keys(periods).forEach(period => {
      (periods[period] || []).forEach(lesson => {
        const date = boardParseTime(lesson.time);
        if (!date) return;
        const key = boardDateKey(date);
        if (key < startKey || key > endKey) return;
        const type = classifyLessonType(lesson.lesson);
        const shared = isYangSharedLesson(project, date, type);
        const index = (date.getDay() + 6) % 7;
        buckets[index].push({ project, period, lesson, date, type, shared });
      });
    });
  });
  buckets.forEach((items, index) => {
    const sharedItems = items.filter(item => item.shared);
    if (sharedItems.length) {
      const normal = items.filter(item => !item.shared);
      const periods = [...new Set(sharedItems.map(item => item.period))].sort((a,b) => a.localeCompare(b,'zh-CN'));
      normal.push({
        project:sharedItems[0].project,
        period:periods.join('、'),
        lesson:{ lesson:'纠音/语聊共同上课' },
        date:new Date(sharedItems[0].date),
        type:'纠音/语聊',
        shared:true,
        items:sharedItems,
        periods
      });
      buckets[index] = normal;
    }
    buckets[index].sort((a,b) => a.date - b.date || a.project.name.localeCompare(b.project.name,'zh-CN'));
  });
  return buckets;
}
function boardMode(values) {
  const counts = new Map();
  values.filter(Boolean).forEach(value => counts.set(value, (counts.get(value) || 0) + 1));
  return [...counts.entries()].sort((a,b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]),'zh-CN'))[0]?.[0] || '';
}
function boardTypeMatches(actual, expected) {
  return expected === '纠音/语聊' ? (actual === '纠音' || actual === '语聊') : actual === expected;
}
function buildPeriodPattern(projectKey, period, fallbackWeek) {
  const days = Array.from({length:7}, () => []);
  const dates = [];
  const rows = ((COURSE_DATA[projectKey] || {})[period] || []);
  const indexed = rows.map(lesson => {
    const date = boardParseTime(lesson.time);
    if (date) dates.push(date);
    return { lesson, date, type:classifyLessonType(lesson.lesson) };
  });
  if (fallbackWeek) {
    BOARD_DAYS.forEach((day, index) => {
      const type = fallbackWeek[day.key];
      if (!type) return;
      const matching = indexed.filter(item => item.date && ((item.date.getDay()+6)%7) === index && boardTypeMatches(item.type,type));
      const specificTimes = matching.filter(item => boardHasSpecificTime(item.date)).map(item => boardTimeText(item.date));
      const time = period === '0324期' || type === '纠音/语聊' ? '20:00' : (boardMode(specificTimes) || '20:00');
      days[index].push({ type, time, planned:!matching.length, refs:matching.map(item => boardLessonRef(projectKey,period,item.lesson)) });
    });
  } else {
    BOARD_DAYS.forEach((day,index) => {
      const matching = indexed.filter(item => item.date && boardHasSpecificTime(item.date) && ((item.date.getDay()+6)%7) === index);
      if (!matching.length) return;
      const combo = boardMode(matching.map(item => item.type + '|' + boardTimeText(item.date)));
      if (!combo) return;
      const [type,time] = combo.split('|');
      const same = matching.filter(item => item.type === type && boardTimeText(item.date) === time);
      days[index].push({ type, time, planned:false, refs:same.map(item => boardLessonRef(projectKey,period,item.lesson)) });
    });
  }
  dates.sort((a,b) => a-b);
  return { days, start: dates[0] || null, end: dates[dates.length-1] || null };
}
function renderPatternCell(entries, detailTitle) {
  if (!entries || !entries.length) return '<span class="pattern-rest">—</span>';
  return `<div class="pattern-cell">${entries.map(entry => {
    const key = registerBoardDetail((detailTitle || '行课计划') + ' · ' + entry.type, entry.refs || []);
    return `<div class="pattern-entry">${boardTypeChip(entry.type)}<span class="pattern-time">${boardEscape(entry.time)}</span>${boardDetailButton(key,(entry.refs||[]).length)}</div>`;
  }).join('')}</div>`;
}
function currentBoardWeekIndex() {
  return (new Date().getDay() + 6) % 7;

  return `<div class="card week-board-card">

}

  return encodeURIComponent(String(value == null ? '' : value));
}
function boardDecode(value) {
  try { return decodeURIComponent(String(value || '')); } catch (error) { return String(value || ''); }
}
function boardNotice(message) {

function openBoardDetail(key) {
  const detail = boardDetailRegistry[key];
  const backdrop = document.getElementById('boardDetailBackdrop');

function closeBoardDetail() {

}
function boardFormIdentity(button) {
  const form = button.closest('.board-lesson-form');
  return form ? {
    form,
    projectKey:boardDecode(form.dataset.project),
    period:boardDecode(form.dataset.period),
    id:boardDecode(form.dataset.id)
  } : null;
}
function saveBoardLesson(button) {
  const identity = boardFormIdentity(button);
  if (!identity || !window.YaraMasterSchedule) return;
  const patch = {};
  identity.form.querySelectorAll('[data-field]').forEach(input => { patch[input.dataset.field] = input.value.trim(); });
  if (patch.time && !/^\d{4}-\d{2}-\d{2}(?:\s+\d{2}:\d{2})?$/.test(patch.time)) {
    boardNotice('行课时间请使用 YYYY-MM-DD HH:mm 格式');
    identity.form.querySelector('[data-field="time"]')?.focus();
    return;
  }
  try {
    closeBoardDetail();
    window.YaraMasterSchedule.updateLesson(identity.projectKey,identity.period,identity.id,patch);
    boardNotice('主课表已保存，相关看板已同步更新');
  } catch (error) {
    boardNotice(error.message || '保存失败，请稍后重试');
  }
}
function deleteBoardLesson(button) {
  const identity = boardFormIdentity(button);
  if (!identity || !window.YaraMasterSchedule) return;
  if (button.dataset.confirmed !== 'true') {
    button.dataset.confirmed = 'true';
    button.textContent = '再次点击确认删除';
    setTimeout(() => { if (button.isConnected) { button.dataset.confirmed=''; button.textContent='删除'; } }, 3500);
    return;
  }
  try {
    closeBoardDetail();
    window.YaraMasterSchedule.deleteLesson(identity.projectKey,identity.period,identity.id);
    boardNotice('课节已删除，可点击“撤销上一步”恢复');
  } catch (error) {
    boardNotice(error.message || '删除失败，请稍后重试');
  }
}
function undoBoardChange() {
  if (!window.YaraMasterSchedule) return;
  const restored = window.YaraMasterSchedule.undo();
  if (restored) {
    closeBoardDetail();
    boardNotice('已撤销上一步主课表修改');
  } else {
    boardNotice('当前没有可撤销的修改');
  }
}

function filterTable() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();

  let visible = 0;
  let chapterVisible = true;
  rows.forEach(row => {

      const chName = row.textContent.trim();
      chapterVisible = !ch || chName === ch;
      row.style.display = chapterVisible ? '' : 'none';

    if (!chapterVisible) { row.style.display = 'none'; return; }
    const text = row.textContent.toLowerCase();

    row.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('resultCount').textContent = `共 ${visible} 节课`;

// ===== 自动排课生成器 (Auto Schedule Generator) =====
const WEEKDAY_NAMES = ['周日','周一','周二','周三','周四','周五','周六'];
const TYPE_COLOR = { '亲授':'#2563eb', '纠音':'#16a34a', '语聊':'#d97706', '外教':'#7a6a9a' };
const TYPE_BG = { '亲授':'#eff3fa', '纠音':'#e9efe2', '语聊':'#f5ecd9', '外教':'#ece8f2' };

function _parseDate(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function _addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function _fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// 两阶段排课：主阶段(亲授未排完)周二/四/六亲授+周三纠音语聊轮换+固定外教日；
// 尾阶段(亲授排完后)仅周三纠音每两周一次直到纠音排完。节假日跳过且队列不前进=顺延补课。
function generateSchedule(startDateStr, opts){
  opts = opts || {};
  const skipHolidays = opts.skipHolidays !== false;
  const waijiaoOffset = (opts.waijiaoOffset != null) ? opts.waijiaoOffset : 4; // 默认周五(周一=0)
  const qinshouOffsets = opts.qinshouOffsets || [1,3,5]; // 默认周二/四/六
  const wedOffset = (opts.wedOffset != null) ? opts.wedOffset : 2; // 周三
  const firstWed = opts.firstWed || 'jiuyin';
  const start = _parseDate(startDateStr);
  const dow = start.getDay();
  let curMonday = _addDays(start, dow === 0 ? -6 : 1 - dow);
  const qQ = QINSHOU_CURRICULUM.slice();
  const jQ = JIUYIN_CURRICULUM.slice();
  const lessons = [];
  let week = 0, guard = 0;
  while ((qQ.length > 0 || jQ.length > 0) && guard < 260){
    guard++;
    const inMain = qQ.length > 0;
    [1,2,3,4,5].forEach(off => {
      const date = _addDays(curMonday, off);
      if (date < start) return;
      const ds = _fmt(date);
      if (skipHolidays && HOLIDAYS_2026.has(ds)) return; // 节假日跳过，队列不前进 → 顺延
      let type = null, name = null;
      if (inMain){
        if (qinshouOffsets.includes(off)){ type = '亲授'; name = qQ.shift(); }
        else if (off === wedOffset){
          const jy = (firstWed === 'jiuyin') ? (week % 2 === 0) : (week % 2 === 1);
          if (jy && jQ.length > 0){ type = '纠音'; name = jQ.shift(); }
          else { type = '语聊'; name = YULIAO_NAME; }
        }
        else if (off === waijiaoOffset){ type = '外教'; name = WAIJIAO_NAME; }
      } else {
        if (off === wedOffset){
          const jy = (firstWed === 'jiuyin') ? (week % 2 === 0) : (week % 2 === 1);
          if (jy && jQ.length > 0){ type = '纠音'; name = jQ.shift(); }
        }
      }
      if (type && name) lessons.push({ date, dateStr: ds, weekday: date.getDay(), week: week+1, type, name });
    });
    curMonday = _addDays(curMonday, 7);
    week++;
  }
  const cnt = {};
  lessons.forEach(l => { cnt[l.type] = (cnt[l.type] || 0); l.seq = cnt[l.type]++; });
  return lessons;
}

// 对比"含节假日顺延"与"理想无节假日"排期：仅标记直接吸收节假日的补课节
// （即该类型课节相对理想排期的延迟天数首次增加处），并记录顺延天数 deferDays
function markDeferred(real, ideal){
  const map = {};
  ideal.forEach(l => { map[l.type + '#' + l.seq] = l.dateStr; });
  const dayMs = 86400000;
  const gap = (a, b) => Math.round((_parseDate(b) - _parseDate(a)) / dayMs);
  const prevDelay = {};
  real.forEach(l => {
    const id = map[l.type + '#' + l.seq];
    const delay = id ? gap(id, l.dateStr) : 0;
    const prev = prevDelay[l.type] || 0;
    l.deferred = delay > prev && delay > 0;
    l.deferDays = delay;
    prevDelay[l.type] = delay;
  });
  return real;
}

function parseAllocationIntakeDates(value) {
  if (!value) return [];
  return String(value).split(/[、,，\s]+/).map(token => token.replace(/\D/g,'')).filter(Boolean).map(token => {
    const compact = token.slice(-4);
    if (compact.length !== 4) return null;
    const month = Number(compact.slice(0,2));
    const day = Number(compact.slice(2,4));
    const date = new Date(2026, month-1, day);
    return date.getMonth() === month-1 && date.getDate() === day ? date : null;
  }).filter(Boolean);
}

function renderAllocationIntakeWeeks(value) {
  const dates = parseAllocationIntakeDates(value);
  if (!dates.length) return '<span class="pattern-rest">—</span>';
  const now = new Date();
  const currentMonday = boardStartOfWeek(now);
  const currentSunday = boardAddDays(currentMonday, 6);
  return `<div class="intake-week-list">${dates.map(date => {
    const monday = boardStartOfWeek(date);
    const sunday = boardAddDays(monday, 6);
    const isCurrent = date >= currentMonday && date <= currentSunday;
    return `<span class="intake-week${isCurrent?' is-current':''}">${boardShortDate(date)} 接量<br>${boardShortDate(monday)}—${boardShortDate(sunday)}</span>`;
  }).join('')}</div>`;
}

function renderAllocScheduleView() {
  const todayIndex = currentBoardWeekIndex();
  let rows = '';
  SCHEDULE_DATA.forEach(schedule => {
    const isH2 = ALLOCATION_DATA.some(item => item.period === schedule.period);
    const pattern = buildPeriodPattern('杨家成3980', schedule.period, schedule.week, new Date());
    rows += `<tr style="${isH2?'':'opacity:.58'}"><td><div class="period-name">${boardEscape(schedule.period)} ${isH2?'<span class="badge badge-blue" style="font-size:10px">H2</span>':''}</div><div class="period-meta">${isH2?'下半年在管期班':'历史节奏参考'}</div></td>`;
    rows += `<td>${renderAllocationIntakeWeeks(schedule.intake)}</td><td style="white-space:nowrap">${boardEscape(schedule.endDate)}</td>`;
    pattern.days.forEach((entries,index) => { rows += `<td class="${index===todayIndex?'is-today-col':''}">${renderPatternCell(entries)}</td>`; });
    rows += '</tr>';
  });
  return `<div style="padding:18px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <div><strong>期班接量与周行课看板</strong><div class="week-board-subtitle">每个接量日期同时显示所在周；课型与时刻优先读取主课表，未建课的星期以“计划”标识</div></div>
    <div class="board-legend">${['亲授','外教','纠音','语聊'].map(boardTypeChip).join('')}</div>
  </div>
  <div class="pattern-table-wrap"><table class="pattern-table"><thead><tr><th>期班</th><th>接量周</th><th>结课时间</th>${BOARD_DAYS.map((day,index)=>`<th class="${index===todayIndex?'is-today-col':''}">${day.name}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
  <div style="padding:12px 20px 18px"><p class="board-note">“计划”来自既有接量排期规则；今天起的具体课程日期与时刻一旦写入主课表，看板会自动切换为实际时刻。00:00 日期占位不作为行课，周日已纳入完整周表。</p></div>`;
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  currentModule = requestedView();
  document.getElementById('currentDate').textContent = formatDate();
  switchModule(currentModule);
  if (window.YaraMasterSchedule) {
    window.YaraMasterSchedule.subscribe(() => {
      window.YaraMasterSchedule.hydrateCourseData(COURSE_DATA);
      switchModule(currentModule);
    });
  }
});
</script>
<script id="yaraSystemBridge" src="../yara-system-bridge.js?v=1.7"></script>
