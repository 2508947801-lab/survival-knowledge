<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eef4ed">
  <title>私密模块保护 · Yara</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 10% 0,#fff0e4,transparent 32%),radial-gradient(circle at 90% 0,#dff1e6,transparent 30%),#eef4ed;color:#405047;font-family:"Avenir Next","PingFang SC",sans-serif}.card{width:min(580px,100%);padding:28px;border:1px solid rgba(82,111,95,.13);border-radius:26px;background:rgba(255,253,248,.95);box-shadow:0 20px 60px rgba(67,91,77,.13)}.icon{display:grid;place-items:center;width:54px;height:54px;border-radius:18px;background:#e6f2eb;font-size:1.5rem}h1{margin:16px 0 7px;font-size:1.5rem;letter-spacing:-.04em}p{margin:0;color:#738078;font-size:.78rem;line-height:1.8}.note{margin-top:16px;padding:13px;border-radius:14px;background:#f2f5ef;color:#637168;font-size:.7rem}.back{display:inline-flex;margin-top:18px;padding:9px 14px;border-radius:12px;background:#62a98f;color:#fff;text-decoration:none;font-size:.72rem;font-weight:750}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🔐</div>
    <h1 id="title">这个模块已转为私密模式</h1>
    <p id="copy">为保护个人简历、学员姓名、手机号和业务数据，该模块不再发布到公开 GitHub Pages。请在私有源码环境或未来带身份认证的站点中使用。</p>
    <div class="note">本地功能与原始数据没有删除；公开站点只隐藏入口和发布文件。</div>
    <a class="back" href="管理系统.html">返回成长花园</a>
  </main>
  <script>
    if(location.hash==='#career'){document.getElementById('title').textContent='“把把必中”已转为私密模式';}
    if(location.hash==='#reconcile'){document.getElementById('title').textContent='“账号异常对账”已转为私密模式';}
  </script>
</body>
</html>
