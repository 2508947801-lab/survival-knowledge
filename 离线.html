<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172033">
  <title>Yara · 暂时离线</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Avenir Next","PingFang SC",sans-serif;color:#f3f0ff;background:radial-gradient(circle at 10% 10%,rgba(255,107,157,.24),transparent 42%),radial-gradient(circle at 90% 85%,rgba(94,234,212,.16),transparent 46%),#172033}.card{width:min(440px,100%);padding:32px 28px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(255,255,255,.07);box-shadow:0 26px 80px rgba(0,0,0,.35);backdrop-filter:blur(18px);text-align:center}.plant{font-size:3.6rem;filter:drop-shadow(0 10px 20px rgba(94,234,212,.22))}h1{font-size:1.35rem;margin:16px 0 9px}p{margin:0;color:#b9b3d8;font-size:.86rem;line-height:1.8}.actions{display:flex;justify-content:center;gap:10px;margin-top:24px}button,a{min-height:44px;padding:0 17px;border-radius:14px;font:inherit;font-size:.8rem;font-weight:750;cursor:pointer}button{border:0;color:#102033;background:linear-gradient(135deg,#5eead4,#7aa5ff)}a{display:inline-flex;align-items:center;text-decoration:none;border:1px solid rgba(255,255,255,.16);color:#f3f0ff;background:rgba(255,255,255,.06)}small{display:block;margin-top:18px;color:#8f87b8;line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <div class="plant" aria-hidden="true">🌱</div>
    <h1>网络暂时走神了</h1>
    <p>已缓存的页面仍可继续使用；云端同步会在网络恢复后重新连接。你的本地数据不会因为这个页面被修改。</p>
    <div class="actions"><button type="button" onclick="location.reload()">重新连接</button><a href="管理系统.html">返回首页</a></div>
    <small>如果某个模块尚未在这台设备上打开过，它可能需要联网后才能首次加载。</small>
  </main>
</body>
</html>
