<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记账本 · Yara</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#059669; --primary-l:#e7f6f0; --ink:#1e293b; --sub:#64748b;
  --border:#e2e8f0; --bg:#f1f5f9; --card:#fff;
  --income:#16a34a; --income-l:#eaf7ef; --expense:#e11d48; --expense-l:#fdeef1;
  --warning:#d97706; --warning-l:#fdf3e3;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
.app{max-width:820px;margin:0 auto;padding:18px 14px 60px;}

.hd{text-align:center;padding:14px 0 8px;}
.hd h1{font-size:1.45rem;font-weight:800;letter-spacing:.5px;}
.hd .sub{font-size:.72rem;color:var(--sub);letter-spacing:2px;margin-top:2px;}
.sync-tip{text-align:center;font-size:.7rem;color:var(--sub);margin:6px 0;}
.sync-tip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--income);margin-right:4px;vertical-align:1px;}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:13px;box-shadow:0 1px 3px rgba(15,23,42,.05);}
.card-title{font-size:.82rem;font-weight:700;color:var(--sub);margin-bottom:10px;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;}

/* month bar */
.monthbar{display:flex;align-items:center;gap:8px;justify-content:center;margin:12px 0;}
.mnav{width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:1rem;cursor:pointer;color:var(--ink);}
.mnav:hover{background:var(--primary-l);border-color:var(--primary);color:var(--primary);}
#monthPick{border:1px solid var(--border);border-radius:9px;padding:7px 12px;font-size:.9rem;font-family:inherit;font-weight:700;}

/* summary */
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.sum-cell{border-radius:11px;padding:10px 8px;text-align:center;background:var(--primary-l);}
.sum-cell .v{font-size:1.05rem;font-weight:800;}
.sum-cell .k{font-size:.66rem;color:var(--sub);margin-top:2px;}
.sum-cell.inc{background:var(--income-l);} .sum-cell.inc .v{color:var(--income);}
.sum-cell.exp{background:var(--expense-l);} .sum-cell.exp .v{color:var(--expense);}
.sum-cell.bal .v{color:var(--primary);}
.sum-cell.wk{background:var(--warning-l);} .sum-cell.wk .v{color:var(--warning);}

/* budget */
.bud-row{margin-bottom:9px;}
.bud-row:last-child{margin-bottom:0;}
.bud-head{display:flex;justify-content:space-between;font-size:.76rem;margin-bottom:3px;}
.bud-head .over{color:var(--expense);font-weight:700;}
.bud-bar{height:8px;background:var(--border);border-radius:20px;overflow:hidden;}
.bud-bar .fill{height:100%;border-radius:20px;background:var(--primary);transition:width .3s;}
.bud-bar .fill.over{background:var(--expense);}
.bud-total{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;padding-top:8px;margin-top:6px;border-top:1px dashed var(--border);}
.alert{background:var(--expense-l);color:var(--expense);border-radius:9px;padding:7px 11px;font-size:.76rem;font-weight:600;margin-top:9px;}

/* charts */
.chart-box{position:relative;height:230px;}
.chart-box.sm{height:200px;}

/* goal */
.goal-prog{margin:6px 0 10px;}
.goal-bar{height:14px;background:var(--border);border-radius:20px;overflow:hidden;}
.goal-bar .fill{height:100%;background:linear-gradient(90deg,#059669,#34d399);border-radius:20px;transition:width .4s;}
.goal-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;}
.goal-stat{background:var(--primary-l);border-radius:10px;padding:8px 10px;}
.goal-stat .v{font-size:.95rem;font-weight:800;color:var(--primary);}
.goal-stat .k{font-size:.66rem;color:var(--sub);}
.goal-form{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.goal-form label{font-size:.68rem;color:var(--sub);display:block;margin-bottom:2px;}
.goal-form input{width:100%;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:.82rem;font-family:inherit;}
.goal-form input:focus{border-color:var(--primary);outline:none;}

/* add form */
.type-toggle{display:flex;gap:8px;margin-bottom:10px;}
.type-btn{flex:1;border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px;font-size:.88rem;font-weight:700;cursor:pointer;color:var(--sub);}
.type-btn.on.exp{background:var(--expense);border-color:var(--expense);color:#fff;}
.type-btn.on.inc{background:var(--income);border-color:var(--income);color:#fff;}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.add-grid .full{grid-column:1 / -1;}
.fld label{font-size:.68rem;color:var(--sub);display:block;margin-bottom:2px;}
.fld input,.fld select{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 10px;font-size:.86rem;font-family:inherit;background:#fff;}
.fld input:focus,.fld select:focus{border-color:var(--primary);outline:none;}
#fAmount{font-size:1.1rem;font-weight:800;}
.add-btn{grid-column:1 / -1;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:11px;font-size:.92rem;font-weight:700;cursor:pointer;}
.add-btn:hover{background:#047857;}

/* ledger */
.filter-row{display:flex;gap:8px;margin-bottom:10px;}
.filter-row select{flex:1;border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:.8rem;font-family:inherit;background:#fff;}
.tx{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #f1f5f9;}
.tx:last-child{border-bottom:none;}
.tx-ico{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:var(--primary-l);display:flex;align-items:center;justify-content:center;font-size:1rem;}
.tx-body{flex:1;min-width:0;}
.tx-cat{font-size:.86rem;font-weight:600;}
.tx-meta{font-size:.7rem;color:var(--sub);margin-top:1px;word-break:break-all;}
.tx-amt{font-size:.92rem;font-weight:800;white-space:nowrap;}
.tx-amt.exp{color:var(--expense);} .tx-amt.inc{color:var(--income);}
.tx .del{width:24px;height:24px;flex:0 0 24px;border:none;background:transparent;color:#cbd5e1;font-size:1rem;cursor:pointer;border-radius:6px;}
.tx .del:hover{background:#fee2e2;color:var(--expense);}
.empty{text-align:center;color:var(--sub);font-size:.82rem;padding:24px 10px;}

/* settings */
.set-toggle{cursor:pointer;user-select:none;}
.set-body{display:none;margin-top:10px;}
.set-body.open{display:block;}
.set-sec{margin-bottom:14px;}
.set-sec h4{font-size:.78rem;color:var(--sub);margin-bottom:6px;}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--primary-l);color:var(--primary);border-radius:20px;padding:3px 10px;font-size:.74rem;font-weight:600;}
.chip .x{cursor:pointer;font-weight:800;opacity:.6;}
.chip .x:hover{opacity:1;}
.add-line{display:flex;gap:7px;}
.add-line input{flex:1;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:.8rem;font-family:inherit;}
.add-line button{border:none;background:var(--primary);color:#fff;border-radius:8px;padding:7px 13px;font-size:.8rem;font-weight:700;cursor:pointer;}
.bud-set-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.8rem;}
.bud-set-row span{flex:1;}
.bud-set-row input{width:110px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:.8rem;font-family:inherit;}

.foot{text-align:center;font-size:.68rem;color:#94a3b8;margin-top:24px;letter-spacing:1px;}

@media(max-width:560px){
  .sum-grid{grid-template-columns:repeat(2,1fr);}
  .goal-form{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <h1>记账本</h1>
    <p class="sub">DAILY LEDGER · YARA</p>
    <p class="sync-tip"><span class="dot"></span>已开启云同步 · web 与手机实时一致</p>
  </header>

  <div class="monthbar">
    <button class="mnav" id="prevMonth">←</button>
    <input type="month" id="monthPick">
    <button class="mnav" id="nextMonth">→</button>
  </div>

  <!-- 概览 -->
  <div class="card">
    <div class="card-title">收支概览</div>
    <div class="sum-grid" id="sumGrid"></div>
  </div>

  <!-- 预算 -->
  <div class="card" id="budgetCard">
    <div class="card-title">本月预算</div>
    <div id="budgetBody"></div>
  </div>

  <!-- 趋势图 -->
  <div class="card">
    <div class="card-title">近 6 个月收支趋势</div>
    <div class="chart-box"><canvas id="trendChart"></canvas></div>
  </div>

  <!-- 分类 + 账户 -->
  <div class="card">
    <div class="card-title">本月支出 · 按分类</div>
    <div class="chart-box sm"><canvas id="catChart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">本月支出 · 按支付方式</div>
    <div class="chart-box sm"><canvas id="acctChart"></canvas></div>
  </div>

  <!-- 投资追踪 -->
  <div class="card">
    <div class="card-title">投资追踪 <span style="font-weight:400;color:var(--sub);font-size:.7rem">市值计入总资产</span></div>
    <div class="sum-grid" id="invSum"></div>
    <div id="invList" style="margin-top:10px"></div>
    <div class="add-grid" style="margin-top:10px">
      <div class="fld full"><label>投资名称（如：广发远见智选混合C）</label><input id="hName" type="text" maxlength="40" placeholder="基金 / 股票 / 理财名称"></div>
      <div class="fld"><label>投入成本（元）</label><input id="hCost" type="number" step="0.01" min="0" placeholder="0.00"></div>
      <div class="fld"><label>当前市值（元）</label><input id="hValue" type="number" step="0.01" min="0" placeholder="0.00"></div>
      <div class="fld full"><label>备注（可选，如代码 / 仓位）</label><input id="hNote" type="text" maxlength="40" placeholder="如：016874"></div>
      <button class="add-btn" id="hAddBtn">＋ 添加持仓</button>
    </div>
    <button class="add-btn" id="snapBtn" style="margin-top:9px;background:#0d9488">📍 记录今日市值</button>
    <div class="card-title" style="margin-top:14px">市值走势</div>
    <div class="chart-box sm" id="snapChartBox" style="display:none"><canvas id="snapChart"></canvas></div>
    <div id="snapHint" style="font-size:.74rem;color:var(--sub);text-align:center;padding:14px 0">记录满 2 天后，这里会显示市值走势曲线 📈</div>
  </div>

  <!-- 财务目标 -->
  <div class="card">
    <div class="card-title">财务目标（3-5 年规划）</div>
    <div id="goalBody"></div>
  </div>

  <!-- 记一笔 -->
  <div class="card">
    <div class="card-title">记一笔</div>
    <div class="type-toggle">
      <button class="type-btn exp on" id="typeExp" data-type="expense">支出</button>
      <button class="type-btn inc" id="typeInc" data-type="income">收入</button>
    </div>
    <div class="add-grid">
      <div class="fld"><label>金额（元）</label><input id="fAmount" type="number" step="0.01" min="0" placeholder="0.00"></div>
      <div class="fld"><label>日期</label><input id="fDate" type="date"></div>
      <div class="fld"><label>分类</label><select id="fCategory"></select></div>
      <div class="fld"><label>支付方式</label><select id="fAccount"></select></div>
      <div class="fld full"><label>备注（可选）</label><input id="fNote" type="text" maxlength="60" placeholder="如：午饭、地铁、工资…"></div>
      <button class="add-btn" id="addBtn">＋ 记一笔</button>
    </div>
  </div>

  <!-- 流水 -->
  <div class="card">
    <div class="card-title">流水明细 <span id="txCount" style="color:var(--primary)"></span></div>
    <div class="filter-row">
      <select id="filterType">
        <option value="all">全部类型</option>
        <option value="expense">只看支出</option>
        <option value="income">只看收入</option>
      </select>
      <select id="filterCat"><option value="all">全部分类</option></select>
    </div>
    <div id="txList"></div>
  </div>

  <!-- 设置 -->
  <div class="card">
    <div class="card-title set-toggle" id="setToggle">⚙️ 设置（分类 / 账户 / 预算） <span style="color:var(--primary)">▶</span></div>
    <div class="set-body" id="setBody"></div>
  </div>

  <div class="foot">Yara · 雅识教育 · 2026</div>
</div>

<script>
// ===== 记账本 =====
const LS_KEY = 'yara_ledger_v1';
const CAT_ICO = {'餐饮':'🍜','交通':'🚇','购物':'🛍️','居住':'🏠','娱乐':'🎮','医疗':'💊','教育':'📚','人情':'🧧','服饰':'👕','日用':'🧴','通讯':'📱','工资':'💰','奖金':'🎁','兼职':'💼','理财':'📈','红包':'🧧','退款':'↩️','其他':'📌'};
const PALETTE = ['#e11d48','#f59e0b','#059669','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16','#06b6d4','#a855f7'];

const DEFAULT_CATEGORIES = {
  expense: ['餐饮','交通','购物','居住','娱乐','医疗','教育','人情','服饰','日用','通讯','其他'],
  income: ['工资','奖金','兼职','理财','红包','退款','其他']
};
const DEFAULT_ACCOUNTS = ['支付宝','微信','银行卡','信用卡','美团月付','抖音月付','现金','其他'];

function defaultState(){
  return {
    transactions: [], deletedIds: [],
    categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
    accounts: DEFAULT_ACCOUNTS.slice(),
    budgets: {},
    goal: { targetAmount:0, targetYear:0, currentSavings:0 },
    holdings: [], snapshots: []
  };
}

// ===== 云同步配置（Supabase，复用 yara_todo 表，行 id=ledger）=====
const SB_URL = 'https://yyqnugidfwgstlcgvnep.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5cW51Z2lkZndnc3RsY2d2bmVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzEzNTAsImV4cCI6MjEwMDgwNzM1MH0.ufK55TfjlF4w98x6Fj28oFjUnYGz4lsY7MRaHVV2aIA';
const SB_ROW = 'ledger';
const SB_POLL_MS = 15000;
let lastSync = 0, saveTimer = null;

let state = load();
let curType = 'expense';
let curMonth = todayStr().slice(0,7);

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function money(n){ return (Math.round(n*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function load(){
  let s;
  try{ s=JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if(!s || !s.transactions) s = defaultState();
  return normalize(s);
}
function normalize(s){
  if(!s.transactions) s.transactions=[];
  if(!s.deletedIds) s.deletedIds=[];
  if(!s.categories) s.categories=JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  if(!s.categories.expense) s.categories.expense=DEFAULT_CATEGORIES.expense.slice();
  if(!s.categories.income) s.categories.income=DEFAULT_CATEGORIES.income.slice();
  if(!s.accounts) s.accounts=DEFAULT_ACCOUNTS.slice();
  if(!s.budgets) s.budgets={};
  if(!s.goal) s.goal={targetAmount:0,targetYear:0,currentSavings:0};
  if(!s.holdings) s.holdings=[];
  if(!s.snapshots) s.snapshots=[];
  return s;
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); scheduleCloudSave(); }

// ===== 云同步（合并式：流水按 id 取并集，避免多端/代记互相覆盖）=====
function sbHeaders(extra){
  const h={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
  for(const k in (extra||{})) h[k]=extra[k];
  return h;
}
function cloudLoad(){
  return fetch(SB_URL+'/rest/v1/yara_todo?id=eq.'+SB_ROW+'&select=data,updated_at',{headers:sbHeaders()})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(rows){ return (rows&&rows.length)?rows[0]:null; })
    .catch(function(){ return null; });
}
function cloudSave(){
  const iso=new Date().toISOString();
  return fetch(SB_URL+'/rest/v1/yara_todo',{
    method:'POST', headers:sbHeaders({'Prefer':'resolution=merge-duplicates'}),
    body:JSON.stringify({id:SB_ROW, data:state, updated_at:iso})
  }).then(function(r){ if(r.ok){ lastSync=Date.parse(iso); } return r.ok; }).catch(function(){ return false; });
}
function scheduleCloudSave(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(function(){ cloudSave(); },600); }
function sig(s){
  return s.transactions.length+':'+s.transactions.map(function(t){return t.id;}).sort().join(',')
    + '|h:'+(s.holdings||[]).map(function(h){return h.id+':'+h.value;}).sort().join(',')
    + '|s:'+(s.snapshots||[]).map(function(x){return x.id+':'+x.value;}).sort().join(',');
}
function unionArr(a,b){ const set=new Set(a); (b||[]).forEach(function(x){ set.add(x); }); return Array.from(set); }
function sortTx(){ state.transactions.sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.created||0)-(a.created||0); }); }

function adoptCloud(row){
  const cloud=row.data;
  const before=sig(state);
  if(cloud){
    const delSet=new Set(state.deletedIds);
    (cloud.deletedIds||[]).forEach(function(id){ delSet.add(id); });
    const byId={};
    state.transactions.forEach(function(t){ byId[t.id]=t; });
    (cloud.transactions||[]).forEach(function(t){ byId[t.id]=t; });
    state.transactions=Object.keys(byId).map(function(k){ return byId[k]; }).filter(function(t){ return !delSet.has(t.id); });
    state.deletedIds=Array.from(delSet);
    // 合并持仓（按 id 取并集）
    const hById={};
    state.holdings.forEach(function(h){ hById[h.id]=h; });
    (cloud.holdings||[]).forEach(function(h){ hById[h.id]=h; });
    state.holdings=Object.keys(hById).map(function(k){ return hById[k]; }).filter(function(h){ return !delSet.has(h.id); });
    // 合并市值快照（id 含日期，天然按日去重）
    const sById={};
    state.snapshots.forEach(function(x){ sById[x.id]=x; });
    (cloud.snapshots||[]).forEach(function(x){ sById[x.id]=x; });
    state.snapshots=Object.keys(sById).map(function(k){ return sById[k]; }).filter(function(x){ return !delSet.has(x.id); }).sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
    if(cloud.categories){
      state.categories.expense=unionArr(state.categories.expense, cloud.categories.expense);
      state.categories.income=unionArr(state.categories.income, cloud.categories.income);
    }
    state.accounts=unionArr(state.accounts, cloud.accounts);
    state.budgets=Object.assign({}, state.budgets, cloud.budgets||{});
    if(cloud.goal && cloud.goal.targetAmount) state.goal=cloud.goal;
    sortTx();
  }
  const after=sig(state);
  lastSync=Date.parse(row.updated_at)||0;
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  render();
  if(before!==after) cloudSave();
}
function initCloud(){
  cloudLoad().then(function(row){
    if(!row || !row.data){ cloudSave(); return; }
    if((Date.parse(row.updated_at)||0) > lastSync) adoptCloud(row);
  });
  setInterval(pollCloud, SB_POLL_MS);
}
function pollCloud(){
  cloudLoad().then(function(row){
    if(!row || !row.data) return;
    if((Date.parse(row.updated_at)||0) > lastSync) adoptCloud(row);
  });
}

// ===== 增删改 =====
function addTx(type, amount, date, category, account, note){
  amount=Math.round(parseFloat(amount)*100)/100;
  if(!amount || amount<=0) return false;
  state.transactions.unshift({
    id:'t'+Date.now()+Math.random().toString(36).slice(2,7),
    type:type, amount:amount, date:date||todayStr(),
    category:category||'其他', account:account||'其他', note:(note||'').trim(), created:Date.now()
  });
  sortTx(); save(); render();
  return true;
}
function delTx(id){
  const i=state.transactions.findIndex(function(x){ return x.id===id; });
  if(i>=0){
    state.deletedIds.push(id);
    state.transactions.splice(i,1);
    save(); render();
  }
}

// ===== 投资追踪 =====
let editHoldingId = null;
function totalCost(){ return state.holdings.reduce(function(a,h){ return a+(h.cost||0); },0); }
function totalValue(){ return state.holdings.reduce(function(a,h){ return a+(h.value||0); },0); }
function netWorth(){ return (state.goal.currentSavings||0) + totalValue(); }
// 记录今日市值快照（id 含日期，同日只留一条）
function upsertSnapshot(){
  const val=totalValue(), today=todayStr(), id='s-'+today;
  const ex=state.snapshots.find(function(s){ return s.id===id; });
  if(ex){ ex.value=val; } else { state.snapshots.push({id:id, date:today, value:val}); }
  state.snapshots.sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
}
function saveHolding(){
  const name=document.getElementById('hName').value.trim();
  const cost=parseFloat(document.getElementById('hCost').value)||0;
  const value=parseFloat(document.getElementById('hValue').value)||0;
  const note=document.getElementById('hNote').value.trim();
  if(!name) return false;
  if(editHoldingId){
    const h=state.holdings.find(function(x){ return x.id===editHoldingId; });
    if(h){ h.name=name; h.cost=cost; h.value=value; h.note=note; h.updated=todayStr(); }
  } else {
    state.holdings.push({id:'h'+Date.now()+Math.random().toString(36).slice(2,6), name:name, cost:cost, value:value, note:note, updated:todayStr()});
  }
  upsertSnapshot(); clearHoldingForm(); save(); render();
  return true;
}
function editHolding(id){
  const h=state.holdings.find(function(x){ return x.id===id; });
  if(!h) return;
  editHoldingId=id;
  document.getElementById('hName').value=h.name;
  document.getElementById('hCost').value=h.cost||'';
  document.getElementById('hValue').value=h.value||'';
  document.getElementById('hNote').value=h.note||'';
  document.getElementById('hAddBtn').textContent='✓ 更新持仓';
}
function delHolding(id){
  const i=state.holdings.findIndex(function(x){ return x.id===id; });
  if(i>=0){ state.deletedIds.push(id); state.holdings.splice(i,1); upsertSnapshot(); save(); render(); }
}
function clearHoldingForm(){
  document.getElementById('hName').value='';
  document.getElementById('hCost').value='';
  document.getElementById('hValue').value='';
  document.getElementById('hNote').value='';
  document.getElementById('hAddBtn').textContent='＋ 添加持仓';
  editHoldingId=null;
}

// ===== 统计 =====
function txOfMonth(ym){ return state.transactions.filter(function(t){ return (t.date||'').slice(0,7)===ym; }); }
function sumBy(list,type){ return list.filter(function(t){return t.type===type;}).reduce(function(a,t){return a+t.amount;},0); }
function groupSum(list,type,key){
  const m={};
  list.filter(function(t){return t.type===type;}).forEach(function(t){ m[t[key]]=(m[t[key]]||0)+t.amount; });
  return m;
}
function weekExpense(){
  const d=new Date(); const day=d.getDay()||7;
  const mon=new Date(d); mon.setDate(d.getDate()-day+1);
  const start=fmtDate(mon), end=todayStr();
  return state.transactions.filter(function(t){ return t.type==='expense' && t.date>=start && t.date<=end; }).reduce(function(a,t){return a+t.amount;},0);
}
function monthList(n){
  const arr=[]; const d=new Date(); d.setDate(1);
  for(let i=n-1;i>=0;i--){ const x=new Date(d.getFullYear(),d.getMonth()-i,1); arr.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')); }
  return arr;
}
function avgMonthlyNet(){
  const ms={};
  state.transactions.forEach(function(t){ const ym=(t.date||'').slice(0,7); if(!ym) return; if(!ms[ym]) ms[ym]={i:0,e:0}; if(t.type==='income') ms[ym].i+=t.amount; else ms[ym].e+=t.amount; });
  const keys=Object.keys(ms);
  if(!keys.length) return 0;
  const total=keys.reduce(function(a,k){ return a+(ms[k].i-ms[k].e); },0);
  return total/keys.length;
}

// ===== 渲染 =====
function render(){
  document.getElementById('monthPick').value=curMonth;
  const list=txOfMonth(curMonth);
  const inc=sumBy(list,'income'), exp=sumBy(list,'expense');
  document.getElementById('sumGrid').innerHTML=
    '<div class="sum-cell inc"><div class="v">'+money(inc)+'</div><div class="k">本月收入</div></div>'+
    '<div class="sum-cell exp"><div class="v">'+money(exp)+'</div><div class="k">本月支出</div></div>'+
    '<div class="sum-cell bal"><div class="v">'+money(inc-exp)+'</div><div class="k">本月结余</div></div>'+
    '<div class="sum-cell wk"><div class="v">'+money(weekExpense())+'</div><div class="k">本周支出</div></div>';
  renderBudget(list, exp);
  renderGoal();
  renderInvest();
  renderInvestChart();
  renderFormOptions();
  renderTxList();
  renderSettings();
  renderCharts();
}

function renderBudget(list, exp){
  const body=document.getElementById('budgetBody');
  const cats=Object.keys(state.budgets).filter(function(c){ return state.budgets[c]>0; });
  if(!cats.length){ body.innerHTML='<div style="font-size:.78rem;color:var(--sub)">还没设置预算～在下方「设置」里给每个分类定个月度预算吧。</div>'; return; }
  const spent=groupSum(list,'expense','category');
  let html='', totalBud=0, totalSpent=0, overs=[];
  cats.forEach(function(c){
    const b=state.budgets[c], s=spent[c]||0;
    totalBud+=b; totalSpent+=s;
    const pct=b? Math.round(s/b*100):0;
    if(s>b) overs.push(c+'（超'+money(s-b)+'）');
    html+='<div class="bud-row"><div class="bud-head"><span>'+c+'</span><span class="'+(s>b?'over':'')+'">'+money(s)+' / '+money(b)+(s>b?' 超支!':'')+'</span></div>'+
      '<div class="bud-bar"><div class="fill'+(s>b?' over':'')+'" style="width:'+Math.min(pct,100)+'%"></div></div></div>';
  });
  const tpct=totalBud?Math.round(totalSpent/totalBud*100):0;
  html+='<div class="bud-total"><span>预算合计 '+money(totalBud)+'</span><span class="'+(totalSpent>totalBud?'over':'')+'">已用 '+money(totalSpent)+'（'+tpct+'%）</span></div>';
  if(overs.length) html+='<div class="alert">⚠️ 本月超支分类：'+overs.join('、')+'</div>';
  body.innerHTML=html;
}

function renderGoal(){
  const body=document.getElementById('goalBody');
  const g=state.goal;
  const invest=totalValue();
  const net=(g.currentSavings||0)+invest;
  if(!g.targetAmount){
    body.innerHTML='<div style="font-size:.8rem;color:var(--sub);margin-bottom:8px">设定你的财务目标，系统按「现金储蓄 + 投资市值」的总资产帮你推算达成进度。</div>'+goalFormHtml();
    return;
  }
  const now=new Date();
  const monthsToTarget=Math.max(1,(g.targetYear-now.getFullYear())*12+(12-now.getMonth()));
  const gap=Math.max(0,g.targetAmount-net);
  const needPerMonth=gap/monthsToTarget;
  const pct=g.targetAmount? Math.min(100,Math.round(net/g.targetAmount*100)):0;
  const avg=avgMonthlyNet();
  let projText='—';
  if(avg>0){ const m=Math.ceil(gap/avg); const pd=new Date(now.getFullYear(),now.getMonth()+m,1); projText=pd.getFullYear()+'年'+(pd.getMonth()+1)+'月（约'+m+'个月）'; }
  else if(avg<=0){ projText='当前月均结余≤0，需先增加储蓄'; }
  body.innerHTML=
    '<div class="goal-prog"><div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:4px"><span>目标 '+money(g.targetAmount)+' · '+g.targetYear+'年</span><span style="color:var(--primary);font-weight:700">'+pct+'%</span></div>'+
    '<div class="goal-bar"><div class="fill" style="width:'+pct+'%"></div></div></div>'+
    '<div style="font-size:.74rem;color:var(--sub);margin:8px 0 2px">总资产 '+money(net)+' ＝ 现金 '+money(g.currentSavings||0)+' ＋ 投资市值 '+money(invest)+'</div>'+
    '<div class="goal-stats">'+
      '<div class="goal-stat"><div class="v">'+money(net)+'</div><div class="k">当前总资产</div></div>'+
      '<div class="goal-stat"><div class="v">'+money(gap)+'</div><div class="k">距离目标还差</div></div>'+
      '<div class="goal-stat"><div class="v">'+money(needPerMonth)+'</div><div class="k">按计划每月需存</div></div>'+
      '<div class="goal-stat"><div class="v" style="font-size:.8rem">'+projText+'</div><div class="k">按当前月均结余预计达成</div></div>'+
    '</div>'+goalFormHtml();
}
function goalFormHtml(){
  const g=state.goal;
  return '<div class="goal-form">'+
    '<div><label>目标金额（元）</label><input id="gTarget" type="number" min="0" value="'+(g.targetAmount||'')+'" placeholder="如 1000000"></div>'+
    '<div><label>目标年份</label><input id="gYear" type="number" min="2026" value="'+(g.targetYear||'')+'" placeholder="如 2030"></div>'+
    '<div><label>现金储蓄（元）</label><input id="gSavings" type="number" min="0" value="'+(g.currentSavings||'')+'" placeholder="如 50000"></div>'+
  '</div><button class="add-btn" id="saveGoal" style="margin-top:9px">保存目标</button>';
}

function renderInvest(){
  const cost=totalCost(), val=totalValue(), gain=val-cost;
  const gpct=cost? (gain/cost*100):0;
  document.getElementById('invSum').innerHTML=
    '<div class="sum-cell"><div class="v">'+money(cost)+'</div><div class="k">投入成本</div></div>'+
    '<div class="sum-cell bal"><div class="v">'+money(val)+'</div><div class="k">当前市值</div></div>'+
    '<div class="sum-cell '+(gain>=0?'inc':'exp')+'"><div class="v">'+(gain>=0?'+':'')+money(gain)+'</div><div class="k">浮动盈亏</div></div>'+
    '<div class="sum-cell '+(gain>=0?'inc':'exp')+'"><div class="v">'+(gain>=0?'+':'')+gpct.toFixed(2)+'%</div><div class="k">盈亏比例</div></div>';
  const box=document.getElementById('invList');
  if(!state.holdings.length){ box.innerHTML='<div class="empty">还没有持仓～把基金/理财的「投入成本」和「当前市值」记上来，自动算盈亏，并计入上方财务目标的总资产。</div>'; return; }
  box.innerHTML=state.holdings.map(function(h){
    const g=(h.value||0)-(h.cost||0);
    const gp=h.cost? (g/h.cost*100):0;
    return '<div class="tx" data-id="'+h.id+'">'+
      '<div class="tx-ico">📈</div>'+
      '<div class="tx-body"><div class="tx-cat">'+esc(h.name)+'</div>'+
      '<div class="tx-meta">成本 '+money(h.cost||0)+(h.note?' · '+esc(h.note):'')+'</div></div>'+
      '<div style="text-align:right"><div class="tx-amt">'+money(h.value||0)+'</div>'+
      '<div class="tx-amt '+(g>=0?'inc':'exp')+'" style="font-size:.72rem">'+(g>=0?'+':'')+money(g)+'（'+(g>=0?'+':'')+gp.toFixed(1)+'%）</div></div>'+
      '<button class="del" data-act="hedit" title="编辑" style="color:var(--primary)">✎</button>'+
      '<button class="del" data-act="hdel" title="删除">×</button>'+
    '</div>';
  }).join('');
}
function renderInvestChart(){
  if(typeof Chart==='undefined') return;
  if(window.__snapChart){ try{ window.__snapChart.destroy(); }catch(e){} window.__snapChart=null; }
  const snaps=state.snapshots||[];
  const hint=document.getElementById('snapHint');
  const box=document.getElementById('snapChartBox');
  if(snaps.length<2){ if(hint) hint.style.display='block'; if(box) box.style.display='none'; return; }
  if(hint) hint.style.display='none'; if(box) box.style.display='block';
  window.__snapChart=new Chart(document.getElementById('snapChart'),{
    type:'line',
    data:{ labels:snaps.map(function(s){ return s.date.slice(5); }),
      datasets:[{label:'总市值',data:snaps.map(function(s){ return Math.round(s.value); }),borderColor:'#059669',backgroundColor:'rgba(5,150,105,.12)',fill:true,tension:.3,pointRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
  });
}

function renderFormOptions(){
  const fc=document.getElementById('fCategory');
  const cats=state.categories[curType]||[];
  fc.innerHTML=cats.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('');
  const fa=document.getElementById('fAccount');
  fa.innerHTML=state.accounts.map(function(a){ return '<option value="'+a+'">'+a+'</option>'; }).join('');
  // 流水筛选分类
  const fcat=document.getElementById('filterCat');
  const cur=fcat.value;
  fcat.innerHTML='<option value="all">全部分类</option>'+cats.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('');
  fcat.value=cur;
}

function renderTxList(){
  const list=txOfMonth(curMonth);
  const ft=document.getElementById('filterType').value;
  const fc=document.getElementById('filterCat').value;
  let arr=list.filter(function(t){ return (ft==='all'||t.type===ft) && (fc==='all'||t.category===fc); });
  document.getElementById('txCount').textContent='· '+arr.length+' 笔';
  const box=document.getElementById('txList');
  if(!arr.length){ box.innerHTML='<div class="empty">这个月还没有记录～</div>'; return; }
  box.innerHTML=arr.map(function(t){
    const ico=CAT_ICO[t.category]||'📌';
    const sign=t.type==='income'?'+':'-';
    return '<div class="tx" data-id="'+t.id+'">'+
      '<div class="tx-ico">'+ico+'</div>'+
      '<div class="tx-body"><div class="tx-cat">'+esc(t.category)+'</div>'+
      '<div class="tx-meta">'+esc(t.account)+(t.note?' · '+esc(t.note):'')+' · '+(t.date||'').slice(5)+'</div></div>'+
      '<div class="tx-amt '+t.type+'">'+sign+money(t.amount)+'</div>'+
      '<button class="del" data-act="del" title="删除">×</button>'+
    '</div>';
  }).join('');
}

function renderSettings(){
  const body=document.getElementById('setBody');
  function chips(arr, kind){
    return '<div class="chip-list">'+arr.map(function(c){ return '<span class="chip">'+esc(c)+'<span class="x" data-kind="'+kind+'" data-val="'+esc(c)+'">×</span></span>'; }).join('')+'</div>';
  }
  let html='<div class="set-sec"><h4>支出分类</h4>'+chips(state.categories.expense,'expCat')+
    '<div class="add-line"><input id="newExpCat" placeholder="新增支出分类"><button data-add="expCat">添加</button></div></div>';
  html+='<div class="set-sec"><h4>收入分类</h4>'+chips(state.categories.income,'incCat')+
    '<div class="add-line"><input id="newIncCat" placeholder="新增收入分类"><button data-add="incCat">添加</button></div></div>';
  html+='<div class="set-sec"><h4>支付方式</h4>'+chips(state.accounts,'acct')+
    '<div class="add-line"><input id="newAcct" placeholder="新增支付方式"><button data-add="acct">添加</button></div></div>';
  html+='<div class="set-sec"><h4>月度预算（每个支出分类）</h4>'+
    state.categories.expense.map(function(c){ return '<div class="bud-set-row"><span>'+esc(c)+'</span><input type="number" min="0" data-bud="'+esc(c)+'" value="'+(state.budgets[c]||'')+'" placeholder="0 表示不设"></div>'; }).join('')+
    '<button class="add-btn" id="saveBudgets" style="margin-top:6px">保存预算</button></div>';
  body.innerHTML=html;
}

function renderCharts(){
  if(typeof Chart==='undefined') return;
  if(window.__charts){ Object.keys(window.__charts).forEach(function(k){ try{ window.__charts[k].destroy(); }catch(e){} }); }
  window.__charts={};
  const opts={ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ font:{size:11} } } } };
  // 趋势
  const ms=monthList(6);
  const incData=ms.map(function(m){ return Math.round(sumBy(txOfMonth(m),'income')); });
  const expData=ms.map(function(m){ return Math.round(sumBy(txOfMonth(m),'expense')); });
  window.__charts.trend=new Chart(document.getElementById('trendChart'),{
    type:'bar', data:{ labels:ms.map(function(m){ return m.slice(5)+'月'; }),
      datasets:[ {label:'收入',data:incData,backgroundColor:'#16a34a',borderRadius:4}, {label:'支出',data:expData,backgroundColor:'#e11d48',borderRadius:4} ]},
    options:opts });
  // 分类
  const list=txOfMonth(curMonth);
  const byCat=groupSum(list,'expense','category');
  const catKeys=Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; });
  if(catKeys.length){
    window.__charts.cat=new Chart(document.getElementById('catChart'),{
      type:'doughnut', data:{ labels:catKeys, datasets:[{data:catKeys.map(function(k){return Math.round(byCat[k]);}),backgroundColor:PALETTE}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10}}}}} });
  }
  // 账户
  const byAcct=groupSum(list,'expense','account');
  const acctKeys=Object.keys(byAcct).sort(function(a,b){ return byAcct[b]-byAcct[a]; });
  if(acctKeys.length){
    window.__charts.acct=new Chart(document.getElementById('acctChart'),{
      type:'bar', data:{ labels:acctKeys, datasets:[{label:'支出',data:acctKeys.map(function(k){return Math.round(byAcct[k]);}),backgroundColor:'#059669',borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}}} });
  }
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ===== EVENTS =====
function setType(t){
  curType=t;
  document.getElementById('typeExp').classList.toggle('on', t==='expense');
  document.getElementById('typeInc').classList.toggle('on', t==='income');
  renderFormOptions();
}
document.getElementById('typeExp').addEventListener('click',function(){ setType('expense'); });
document.getElementById('typeInc').addEventListener('click',function(){ setType('income'); });

document.getElementById('addBtn').addEventListener('click',function(){
  const ok=addTx(curType, document.getElementById('fAmount').value, document.getElementById('fDate').value,
    document.getElementById('fCategory').value, document.getElementById('fAccount').value, document.getElementById('fNote').value);
  if(ok){ document.getElementById('fAmount').value=''; document.getElementById('fNote').value=''; }
});

document.getElementById('prevMonth').addEventListener('click',function(){ shiftMonth(-1); });
document.getElementById('nextMonth').addEventListener('click',function(){ shiftMonth(1); });
document.getElementById('monthPick').addEventListener('change',function(e){ if(e.target.value){ curMonth=e.target.value; render(); } });
function shiftMonth(n){
  const p=curMonth.split('-'); let y=+p[0], m=+p[1]+n;
  if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
  curMonth=y+'-'+String(m).padStart(2,'0'); render();
}

document.getElementById('filterType').addEventListener('change',renderTxList);
document.getElementById('filterCat').addEventListener('change',renderTxList);

document.getElementById('txList').addEventListener('click',function(e){
  const tx=e.target.closest('.tx'); if(!tx) return;
  const act=e.target.closest('[data-act]'); if(!act) return;
  if(act.dataset.act==='del' && confirm('删除这笔记录？')) delTx(tx.dataset.id);
});

// 投资追踪事件
document.getElementById('hAddBtn').addEventListener('click',function(){ saveHolding(); });
document.getElementById('snapBtn').addEventListener('click',function(){ upsertSnapshot(); save(); render(); });
document.getElementById('invList').addEventListener('click',function(e){
  const tx=e.target.closest('.tx'); if(!tx) return;
  const act=e.target.closest('[data-act]'); if(!act) return;
  if(act.dataset.act==='hdel'){ if(confirm('删除这条持仓？')) delHolding(tx.dataset.id); }
  else if(act.dataset.act==='hedit'){ editHolding(tx.dataset.id); }
});

document.getElementById('setToggle').addEventListener('click',function(){
  document.getElementById('setBody').classList.toggle('open');
});

// 设置区事件（事件委托，因 renderSettings 会重绘）
document.getElementById('setBody').addEventListener('click',function(e){
  const x=e.target.closest('.x');
  if(x){ removeItem(x.dataset.kind, x.dataset.val); return; }
  const add=e.target.closest('[data-add]');
  if(add){
    const kind=add.dataset.add;
    const inp=add.previousElementSibling;
    const v=(inp.value||'').trim(); if(!v) return;
    addItem(kind, v); inp.value=''; return;
  }
  if(e.target.id==='saveBudgets'){ saveBudgets(); }
  if(e.target.id==='saveGoal'){ saveGoal(); }
});
// goal 保存按钮也可能在 goalBody 里
document.getElementById('goalBody').addEventListener('click',function(e){
  if(e.target.id==='saveGoal'){ saveGoal(); }
});

function addItem(kind, v){
  if(kind==='expCat'){ if(state.categories.expense.indexOf(v)<0) state.categories.expense.push(v); }
  else if(kind==='incCat'){ if(state.categories.income.indexOf(v)<0) state.categories.income.push(v); }
  else if(kind==='acct'){ if(state.accounts.indexOf(v)<0) state.accounts.push(v); }
  save(); render();
}
function removeItem(kind, v){
  if(kind==='expCat'){ state.categories.expense=state.categories.expense.filter(function(c){return c!==v;}); }
  else if(kind==='incCat'){ state.categories.income=state.categories.income.filter(function(c){return c!==v;}); }
  else if(kind==='acct'){ state.accounts=state.accounts.filter(function(c){return c!==v;}); }
  save(); render();
}
function saveBudgets(){
  const inputs=document.querySelectorAll('[data-bud]');
  const b={};
  inputs.forEach(function(inp){ const v=parseFloat(inp.value); if(v>0) b[inp.dataset.bud]=v; });
  state.budgets=b; save(); render();
}
function saveGoal(){
  state.goal={
    targetAmount:parseFloat(document.getElementById('gTarget').value)||0,
    targetYear:parseInt(document.getElementById('gYear').value)||0,
    currentSavings:parseFloat(document.getElementById('gSavings').value)||0
  };
  save(); render();
}

// ===== INIT =====
document.getElementById('fDate').value=todayStr();
render();
initCloud();
</script>
