<!DOCTYPE html>
<html lang="zh-CN" data-yara-theme="dawn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日工作待办 · Lysie</title>
<style>
:root{
  --primary:#7C5CFF; --primary-l:#EEF3FF; --ink:#1F2937; --sub:#4B5563;
  --border:#E8EDF4; --bg:#F7F9FC; --success:#16a34a; --success-l:#ECFBF8;
  --warning:#F59E42; --warning-l:#FFF6E9; --danger:#E85D67;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
.app{max-width:760px;margin:0 auto;padding:20px 16px 60px;}

/* ===== HEADER ===== */
.hd{text-align:center;padding:18px 0 10px;}
.hd h1{font-size:1.45rem;font-weight:800;letter-spacing:.5px;}
.hd .sub{font-size:.72rem;color:var(--sub);letter-spacing:2px;margin-top:2px;}

/* ===== DATE BAR ===== */
.datebar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin:14px 0;box-shadow:0 1px 3px rgba(15,23,42,.05);}
.dnav{width:38px;height:38px;flex:0 0 38px;border:1px solid var(--border);background:#fff;border-radius:10px;font-size:1.05rem;color:var(--ink);cursor:pointer;transition:all .15s;}
.dnav:hover{background:var(--primary-l);border-color:var(--primary);color:var(--primary);}
.dcenter{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;}
.dlabel{font-size:1.02rem;font-weight:700;}
.dlabel .wk{color:var(--sub);font-weight:600;font-size:.85rem;margin-left:4px;}
.dlabel .today-tag{display:inline-block;background:var(--primary);color:#fff;font-size:.62rem;font-weight:700;padding:1px 7px;border-radius:20px;margin-left:6px;vertical-align:2px;}
#datePick{position:absolute;top:0;left:50%;transform:translateX(-50%);width:100%;height:100%;opacity:0;cursor:pointer;}
.today-btn{flex:0 0 auto;border:1px solid var(--primary);background:var(--primary-l);color:var(--primary);border-radius:10px;padding:8px 14px;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .15s;}
.today-btn:hover{background:var(--primary);color:#fff;}

/* ===== SUMMARY ===== */
.summary{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.05);}
.sum-row{display:flex;gap:10px;flex-wrap:wrap;}
.sum-chip{flex:1;min-width:100px;background:var(--primary-l);border-radius:10px;padding:8px 12px;text-align:center;}
.sum-chip .v{font-size:1.15rem;font-weight:800;color:var(--primary);}
.sum-chip .k{font-size:.68rem;color:var(--sub);margin-top:1px;}
.sum-chip.done .v{color:var(--success);}
.sum-chip.done{background:var(--success-l);}
.progress{height:8px;background:var(--border);border-radius:20px;margin-top:12px;overflow:hidden;}
.progress .fill{height:100%;background:var(--primary);border-radius:20px;transition:width .3s;}
.progress .fill.full{background:var(--success);}
.sum-note{font-size:.72rem;color:var(--sub);margin-top:8px;text-align:center;}

/* ===== ADD BAR ===== */
.addbar{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.05);}
.add-row{display:flex;gap:8px;align-items:center;}
#newTitle{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.88rem;font-family:inherit;outline:none;transition:border .15s;}
#newTitle:focus{border-color:var(--primary);}
.min-input{width:70px;flex:0 0 70px;border:1px solid var(--border);border-radius:10px;padding:10px 8px;font-size:.88rem;text-align:center;outline:none;font-family:inherit;}
.min-input:focus{border-color:var(--primary);}
.min-unit{font-size:.75rem;color:var(--sub);flex:0 0 auto;}
.add-btn{flex:0 0 auto;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .15s;}
.add-btn:hover{background:#6847F0;}
.presets{display:flex;gap:6px;margin-top:9px;align-items:center;}
.presets .pl{font-size:.7rem;color:var(--sub);}
.preset{border:1px solid var(--border);background:#fff;border-radius:20px;padding:3px 12px;font-size:.72rem;color:var(--ink);cursor:pointer;transition:all .15s;}
.preset:hover,.preset.on{background:var(--primary-l);border-color:var(--primary);color:var(--primary);font-weight:600;}

/* ===== TASK LIST ===== */
.tasks{list-style:none;display:flex;flex-direction:column;gap:9px;}
.task{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 13px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:all .18s;}
.task.done{background:#fafbfc;border-color:#eef1f4;}
.chk{width:23px;height:23px;flex:0 0 23px;border:2px solid #cbd5e1;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#fff;transition:all .15s;background:#fff;}
.chk:hover{border-color:var(--success);}
.task.done .chk{background:var(--success);border-color:var(--success);}
.t-body{flex:1;min-width:0;}
.t-title{font-size:.9rem;font-weight:600;word-break:break-word;}
.task.done .t-title{color:#94a3b8;text-decoration:line-through;}
.t-min{flex:0 0 auto;background:var(--primary-l);color:var(--primary);border-radius:20px;padding:3px 11px;font-size:.74rem;font-weight:700;white-space:nowrap;}
.task.done .t-min{background:var(--success-l);color:var(--success);}
.t-actions{display:flex;gap:5px;flex:0 0 auto;align-items:center;}
.edit,.del{min-width:36px;height:30px;padding:0 8px;border:1px solid var(--border);background:#fff;color:var(--sub);font-size:.85rem;font-weight:700;white-space:nowrap;cursor:pointer;border-radius:8px;transition:all .15s;line-height:1;}
.edit:hover{background:var(--primary-l);color:var(--primary);}
.del:hover{background:#fee2e2;color:var(--danger);}

/* 编辑态 */
.task.editing{background:#fffdf2;border-color:#fde68a;box-shadow:0 0 0 2px rgba(217,119,6,.14);align-items:center;}
.task.editing .edit-body{flex:1;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.task.editing .edit-body input{border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:.86rem;font-family:inherit;outline:none;background:#fff;transition:border .15s;}
.task.editing .edit-body input:focus{border-color:var(--primary);}
.task.editing .edit-body input.et{flex:1;min-width:150px;}
.task.editing .edit-body input.em{width:60px;text-align:center;flex:0 0 60px;}
.task.editing .edit-body .em-unit{font-size:.74rem;color:var(--sub);flex:0 0 auto;}
.task.editing .eb{padding:7px 13px;border:none;border-radius:9px;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .15s;}
.task.editing .eb.save{background:var(--primary);color:#fff;}
.task.editing .eb.save:hover{background:#6847F0;}
.task.editing .eb.cancel{background:#f1f5f9;color:var(--sub);}
.task.editing .eb.cancel:hover{background:#e2e8f0;}
.task.removing{opacity:0;transform:translateX(48px);}

.empty{text-align:center;color:var(--sub);font-size:.85rem;padding:44px 20px;background:#fff;border:1px dashed var(--border);border-radius:14px;}

.foot{text-align:center;font-size:.68rem;color:#94a3b8;margin-top:26px;letter-spacing:1px;}

@media(max-width:560px){
  .add-row{flex-wrap:wrap;}
  #newTitle{flex:1 1 100%;}
  .sum-chip{min-width:calc(50% - 5px);}
  .task{align-items:flex-start;flex-wrap:wrap;}
  .t-actions{width:100%;justify-content:flex-end;padding-top:2px;}
}
</style>
<link id="yaraSystemTheme" rel="stylesheet" href="../yara-system-theme.css?v=4.2">
<script src="../yara-runtime-config.js?v=1.0"></script>
<script src="../yara-module-ui.js?v=1.0"></script>
</head>
<body data-yara-module="todo-work">
<div class="app">
  <header class="hd">
    <div class="module-kicker"><span class="module-icon">✓</span><span>工作管理</span></div>
    <h1>每日工作待办</h1>
    <p class="sub">DAILY WORK TODO · LYSIE</p>
    <p class="sync-tip" id="syncTip"><span class="dot"></span><span id="syncText">正在检查云同步…</span></p>
  </header>

  <div class="datebar">
    <button class="dnav" id="prevDay" title="前一天">←</button>
    <div class="dcenter">
      <div class="dlabel" id="dateLabel"></div>
      <input type="date" id="datePick">
    </div>
    <button class="dnav" id="nextDay" title="后一天">→</button>
    <button class="today-btn" id="todayBtn">今天</button>
  </div>

  <div class="summary" id="summary"></div>

  <div class="addbar">
    <div class="add-row">
      <input id="newTitle" type="text" placeholder="新增任务… 如：之昊3980退费处理" maxlength="60">
      <input id="newMin" type="number" class="min-input" min="5" step="5" value="30">
      <span class="min-unit">分钟</span>
      <button class="add-btn" id="addBtn">＋ 添加</button>
    </div>
    <div class="presets">
      <span class="pl">常用耗时：</span>
      <button class="preset" data-m="30">半小时</button>
      <button class="preset" data-m="60">1小时</button>
      <button class="preset" data-m="90">1.5小时</button>
      <button class="preset" data-m="120">2小时</button>
    </div>
  </div>

  <ul class="tasks" id="taskList"></ul>
  <div class="empty" id="emptyState" style="display:none;">这一天还没有任务～<br>在上方添加，或给自己放个假 ☕</div>

  <div class="foot">Lysie · WORK ARCHIVE · 2026</div>
</div>

<script>
// ===== 每日工作待办 =====
const LS_KEY = 'yara_daily_todo_v1';
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
const WORK_TODO_CUTOFF = '2026-08-31';

// 首次使用预置：历史任务 + 2026 年 8 月日常运营排期。
// 预置任务使用稳定 seed ID；用户删除后会进入 deletedSeeds，不会在刷新或云同步后复活。
const SEED = {
  '2026-07-28': [
    {id:'seed1', title:'【0810期】3980 / 1980 / 2000 三品周期管理', minutes:60, done:false},
    {id:'seed2', title:'之昊3980 退费处理', minutes:30, done:false},
    {id:'seed3', title:'钉钉走对公付款流程', minutes:30, done:false},
    {id:'seed4', title:'直播间配置', minutes:60, done:false},
    {id:'seed5', title:'录屏 · 高高40节赠送课', minutes:120, done:false},
    {id:'seed6', title:'【0810期】确认接量人员 · 新建线索接入规则 · 新建招生计划', minutes:60, done:false},
    {id:'seed7', title:'同步杨家成纠音课知识清单 · 高高2980知识清单', minutes:30, done:false},
    {id:'seed8', title:'发放12期结业测试', minutes:10, done:false}
  ]
};

// 2026 年 8 月工作日运营任务：
// 每个工作日：直播间配置 60 分钟、延期的隐藏课程 20 分钟、
//              直播房间加到各期系列课内供营期使用 30 分钟；
// 每周一/三/五：杨家成、张之昊、一对一扩科退费处理 120 分钟、批量处理解锁保留 30 分钟；
// 每周二/四：突发退费处理 30 分钟；每周三：线索接入检查更新、营期检查更新各 20 分钟；
// 每周五晚上：批量开课 15 分钟。
(function seedAugust2026Operations(){
  function addSeed(date, suffix, title, minutes){
    if(!SEED[date]) SEED[date]=[];
    SEED[date].push({
      id:'seed-ops-'+date.replace(/-/g,'')+'-'+suffix,
      title:title,
      minutes:minutes,
      done:false
    });
  }
  for(let day=1; day<=31; day+=1){
    const d=new Date(2026,7,day);
    const weekday=d.getDay();
    if(weekday<1 || weekday>5) continue;
    const date='2026-08-'+String(day).padStart(2,'0');
    addSeed(date,'live-room','直播间配置',60);
    addSeed(date,'delay-hidden','延期的隐藏课程',20);
    addSeed(date,'room-to-series','直播房间加到各期系列课内，供营期使用',30);
    if(weekday===1 || weekday===3 || weekday===5){
      addSeed(date,'refund','杨家成、张之昊、一对一扩科退费处理',120);
      addSeed(date,'unlock-retain','批量处理解锁保留',30);
    }
    if(weekday===2 || weekday===4){
      addSeed(date,'urgent-refund','突发退费处理',30);
    }
    if(weekday===3){
      addSeed(date,'lead-intake-check','杨家成、张之昊线索接入检查&更新',20);
      addSeed(date,'camp-check','杨家成、张之昊营期检查&更新',20);
    }
    if(weekday===5){
      addSeed(date,'open-course','晚上｜批量开课',15);
    }
  }
  // 以当前日期 2026-08-13 计算，“下周一”为 2026-08-17。
  addSeed('2026-08-17','xiaoe-camp-training','小鹅通营期培训',60);
})();

// ===== 云同步配置（Supabase）：让 web 端和手机端待办数据实时一致 =====
const SB_CONFIG = window.YaraRuntimeConfig ? window.YaraRuntimeConfig.supabase() : {url:'',anonKey:'',ready:false};
const SB_URL = SB_CONFIG.url;
const SB_KEY = SB_CONFIG.anonKey;
const SB_SECRET = SB_CONFIG.appSecret;
const SB_ROW = 'main';        // 云端只存一行，id 固定为 main
const SB_POLL_MS = 5000;      // 活跃时每 5 秒拉取一次，手机切回页面时立即补拉
let lastSync = 0;             // 最近一次已知的云端版本时间戳（毫秒）
let saveTimer = null;         // 防抖：短时间内多次改动只上云一次
let seedMergeChanged = false; // 本次合并是否新增了预置，用于把新增排期同步到云端

let state = load();
let current = todayStr();

function todayStr(){ return fmtDate(new Date()); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function shiftDay(s, n){ const d=parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); }

function mergeSeeds(s){
  if(!s.deletedSeeds) s.deletedSeeds=[];
  // 版本化预置升级：只调整仍保留旧默认内容的任务；用户已自行编辑的内容保持不变。
  if(!s.seedVersions) s.seedVersions={};
  if(!s.seedVersions.augustOpsV2){
    for(const date in (s.tasks||{})){
      (s.tasks[date]||[]).forEach(function(task){
        if(/^seed-ops-202608\d{2}-refund$/.test(task.id) && task.title==='批量处理退费' && Number(task.minutes)===90){
          task.title='杨家成、张之昊、一对一扩科退费处理';
          task.minutes=120;
          seedMergeChanged=true;
        }
      });
    }
    s.seedVersions.augustOpsV2=true;
  }
  // 离职边界：2026-08-31 后不再保留岗位日常预置；用户手动新增的任务不受影响。
  if(!s.seedVersions.leaveOpsCutoffV1){
    for(const date in (s.tasks||{})){
      if(date<=WORK_TODO_CUTOFF) continue;
      const kept=[];
      (s.tasks[date]||[]).forEach(function(task){
        if(/^seed-ops-\d{8}-/.test(task.id)){
          if(s.deletedSeeds.indexOf(task.id)<0) s.deletedSeeds.push(task.id);
          seedMergeChanged=true;
          return;
        }
        kept.push(task);
      });
      s.tasks[date]=kept;
    }
    s.seedVersions.leaveOpsCutoffV1=true;
  }
  // 合并新增的预置任务（按 id 判断，已删除的不再恢复）
  for(const date in SEED){
    if(!s.tasks[date]) s.tasks[date]=[];
    SEED[date].forEach(seed=>{
      const exists = s.tasks[date].some(t=>t.id===seed.id);
      const deleted = s.deletedSeeds.indexOf(seed.id)>=0;
      if(!exists && !deleted){
        s.tasks[date].push(JSON.parse(JSON.stringify(seed)));
        seedMergeChanged=true;
      }
    });
  }
  return s;
}
function load(){
  let s;
  try{ s=JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if(!s || !s.tasks) s = {tasks: JSON.parse(JSON.stringify(SEED)), deletedSeeds:[]};
  return mergeSeeds(s);
}
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  scheduleCloudSave();
}

function setSyncStatus(status, message){
  const tip=document.getElementById('syncTip');
  const text=document.getElementById('syncText');
  if(tip) tip.dataset.state=status||'local';
  if(text) text.textContent=message||'本机数据已保存';
}

// ===== 云同步（Supabase REST）=====
function sbHeaders(extra){
  const h = {'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json'};
  if(SB_SECRET) h['x-app-secret']=SB_SECRET;
  for(const k in (extra||{})) h[k]=extra[k];
  return h;
}
function cloudLoad(){
  if(!SB_CONFIG.ready) return Promise.resolve(null);
  return fetch(SB_URL+'/rest/v1/yara_todo?id=eq.'+SB_ROW+'&select=data,updated_at', {headers:sbHeaders()})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(rows){ return (rows && rows.length) ? rows[0] : null; })
    .catch(function(){ setSyncStatus('error','云同步暂时失败 · 本机数据仍安全保留'); return null; });
}
function cloudSave(){
  if(!SB_CONFIG.ready) return Promise.resolve(false);
  const iso = new Date().toISOString();
  return fetch(SB_URL+'/rest/v1/yara_todo', {
    method:'POST',
    headers:sbHeaders({'Prefer':'resolution=merge-duplicates'}),
    body:JSON.stringify({id:SB_ROW, data:state, updated_at:iso})
  }).then(function(r){
    if(r.ok){ lastSync = Date.parse(iso); setSyncStatus('online','云同步已连接 · Web 与手机共用进度'); }
    else setSyncStatus('error','云同步写入失败 · 本机数据仍安全保留');
    return r.ok;
  }).catch(function(){ setSyncStatus('error','云同步写入失败 · 本机数据仍安全保留'); return false; });
}
function scheduleCloudSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ cloudSave(); }, 600);
}
// 采纳云端数据；本地已勾选的完成状态绝不丢失，若因此产生差异则回推云端
function adoptCloud(row){
  const cloud = row.data;
  if(!cloud || !cloud.tasks) return;
  if(!cloud.deletedSeeds) cloud.deletedSeeds=[];
  const localDone = {};
  for(const d in state.tasks){ state.tasks[d].forEach(function(t){ if(t.done) localDone[t.id]=true; }); }
  let changed = false;
  Object.keys(cloud.tasks).forEach(function(d){
    (cloud.tasks[d]||[]).forEach(function(t){
      if(localDone[t.id] && !t.done){ t.done=true; changed=true; }
    });
  });
  seedMergeChanged=false;
  state = mergeSeeds(cloud);
  const seeded = seedMergeChanged;
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  lastSync = Date.parse(row.updated_at)||0;
  setSyncStatus('online','已同步其他设备的最新进度');
  render();
  if(changed || seeded) cloudSave();
}
function initCloud(){
  if(!SB_CONFIG.ready){
    setSyncStatus('local','仅保存在此设备 · 请在系统设置中配置云同步');
    return;
  }
  setSyncStatus('loading','正在连接 Web 与手机端…');
  cloudLoad().then(function(row){
    if(!row || !row.data || !row.data.tasks){
      // 云端还没有数据 → 把本机状态推上去作为基准
      cloudSave();
      return;
    }
    if((Date.parse(row.updated_at)||0) > lastSync) adoptCloud(row);
    else setSyncStatus('online','云同步已连接 · Web 与手机共用进度');
  });
  setInterval(pollCloud, SB_POLL_MS);
  window.addEventListener('focus', pollCloud);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) pollCloud(); });
}
function pollCloud(){
  cloudLoad().then(function(row){
    if(!row || !row.data || !row.data.tasks) return;
    const t = Date.parse(row.updated_at)||0;
    if(t > lastSync) adoptCloud(row);
  });
}

function getTasks(date){ if(!state.tasks[date]) state.tasks[date]=[]; return state.tasks[date]; }

function fmtMin(m){
  if(!m || m<=0) return '0分钟';
  const h=Math.floor(m/60), r=m%60;
  if(h && r) return h+'小时'+r+'分';
  if(h) return h+'小时';
  return r+'分钟';
}

function addTask(title, minutes){
  title = (title||'').trim();
  if(!title) return false;
  minutes = Math.max(5, Math.round(+minutes)||30);
  getTasks(current).push({id:'t'+Date.now()+Math.random().toString(36).slice(2,6), title:title, minutes:minutes, done:false});
  save(); render();
  YaraModuleUI.notify('任务已添加');
  return true;
}
function toggleTask(id){
  const t=getTasks(current).find(x=>x.id===id);
  if(t){ t.done=!t.done; save(); render(); YaraModuleUI.notify(t.done?'任务已完成':'任务已恢复'); }
}
// 局部删除：只移除当前 li + 刷新汇总，避免全量 render 重建造成的卡顿与跳动
function delTask(id){
  const arr=getTasks(current);
  const i=arr.findIndex(x=>x.id===id);
  if(i<0) return;
  if(id.indexOf('seed')===0 && state.deletedSeeds.indexOf(id)<0) state.deletedSeeds.push(id);
  arr.splice(i,1);
  save();
  const li=document.querySelector('.task[data-id="'+cssAttr(id)+'"]');
  if(li){
    li.classList.add('removing');
    setTimeout(function(){
      li.remove();
      renderSummary();
      updateEmpty();
    },150);
  }else{
    render();
  }
  YaraModuleUI.notify('任务已删除');
}
// 编辑：进入编辑态
function enterEdit(id){
  const li=document.querySelector('.task[data-id="'+cssAttr(id)+'"]');
  if(!li) return;
  const t=getTasks(current).find(x=>x.id===id);
  if(!t) return;
  li.classList.add('editing');
  li.innerHTML =
    '<div class="edit-body">'+
      '<input class="et" type="text" maxlength="60" value="'+escAttr(t.title)+'">'+
      '<input class="em" type="number" min="5" step="5" value="'+(t.minutes||30)+'">'+
      '<span class="em-unit">分钟</span>'+
      '<button class="eb save" data-act="save">保存</button>'+
      '<button class="eb cancel" data-act="cancel">取消</button>'+
    '</div>';
  const et=li.querySelector('.et');
  et.focus();
  et.setSelectionRange(et.value.length,et.value.length);
}
// 编辑：保存
function saveEdit(id,title,minutes){
  title=(title||'').trim();
  if(!title){ YaraModuleUI.notify('任务内容不能为空','warning'); return false; }
  minutes=Math.max(5,Math.round(+minutes)||30);
  const t=getTasks(current).find(x=>x.id===id);
  if(t){ t.title=title; t.minutes=minutes; save(); render(); YaraModuleUI.notify('已保存修改'); }
  return true;
}
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cssAttr(s){ return String(s==null?'':s).replace(/"/g,'\\"'); }

function renderSummary(){
  const tasks=getTasks(current);
  const total=tasks.length;
  const doneN=tasks.filter(t=>t.done).length;
  const totalMin=tasks.reduce((a,t)=>a+(t.minutes||0),0);
  const doneMin=tasks.filter(t=>t.done).reduce((a,t)=>a+(t.minutes||0),0);
  const pct = total? Math.round(doneN/total*100) : 0;

  document.getElementById('summary').innerHTML =
    '<div class="sum-row">'+
      '<div class="sum-chip"><div class="v">'+doneN+' / '+total+'</div><div class="k">完成 / 总数</div></div>'+
      '<div class="sum-chip done"><div class="v">'+fmtMin(doneMin)+'</div><div class="k">已投入</div></div>'+
      '<div class="sum-chip"><div class="v">'+fmtMin(totalMin)+'</div><div class="k">总预计</div></div>'+
      '<div class="sum-chip"><div class="v">'+fmtMin(totalMin-doneMin)+'</div><div class="k">剩余</div></div>'+
    '</div>'+
    '<div class="progress"><div class="fill'+(pct>=100?' full':'')+'" style="width:'+pct+'%"></div></div>'+
    '<div class="sum-note">'+(total? ('今日进度 '+pct+'%'+(pct>=100?' · 全部完成 🎉':'')) :'今天还没安排任务 💪')+'</div>';
}
function updateEmpty(){
  const total=getTasks(current).length;
  const empty=document.getElementById('emptyState');
  empty.innerHTML=current>WORK_TODO_CUTOFF
    ? '离职后的岗位日常待办已停止预置～<br>如有个人安排，仍可在上方自行添加 ☕'
    : '这一天还没有任务～<br>在上方添加，或给自己放个假 ☕';
  empty.style.display = total? 'none':'block';
}

function render(){
  // 日期标签
  const d=parseDate(current);
  const isToday = current===todayStr();
  document.getElementById('dateLabel').innerHTML =
    (d.getMonth()+1)+'月'+d.getDate()+'日<span class="wk">'+WEEK[d.getDay()]+'</span>' +
    (isToday?'<span class="today-tag">今天</span>':'');
  document.getElementById('datePick').value = current;

  renderSummary();

  const tasks=getTasks(current);
  const list=document.getElementById('taskList');
  list.innerHTML = tasks.map(t=>
    '<li class="task'+(t.done?' done':'')+'" data-id="'+escAttr(t.id)+'">'+
      '<div class="chk" data-act="toggle">'+(t.done?'✓':'')+'</div>'+
      '<div class="t-body"><div class="t-title">'+escHtml(t.title)+'</div></div>'+
      '<span class="t-min">'+fmtMin(t.minutes)+'</span>'+
      '<div class="t-actions">'+
        '<button class="edit" type="button" data-act="edit" aria-label="编辑任务" title="编辑任务">✎</button>'+
        '<button class="del" type="button" data-act="del" data-yara-confirm="module" aria-label="删除任务" title="删除任务">×</button>'+
      '</div>'+
    '</li>'
  ).join('');
  updateEmpty();
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== EVENTS =====
document.getElementById('prevDay').addEventListener('click', ()=>{ current=shiftDay(current,-1); render(); });
document.getElementById('nextDay').addEventListener('click', ()=>{ current=shiftDay(current,1); render(); });
document.getElementById('todayBtn').addEventListener('click', ()=>{ current=todayStr(); render(); });
document.getElementById('datePick').addEventListener('change', e=>{ if(e.target.value){ current=e.target.value; render(); } });

document.getElementById('addBtn').addEventListener('click', ()=>{
  const ti=document.getElementById('newTitle');
  if(addTask(ti.value, document.getElementById('newMin').value)){ ti.value=''; ti.focus(); }
});
document.getElementById('newTitle').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const ti=document.getElementById('newTitle');
    if(addTask(ti.value, document.getElementById('newMin').value)){ ti.value=''; }
  }
});

document.querySelectorAll('.preset').forEach(p=>{
  p.addEventListener('click', ()=>{
    document.getElementById('newMin').value=p.dataset.m;
    document.querySelectorAll('.preset').forEach(x=>x.classList.remove('on'));
    p.classList.add('on');
  });
});

document.getElementById('taskList').addEventListener('click', e=>{
  const li=e.target.closest('.task');
  if(!li) return;
  const id=li.dataset.id;
  const act=e.target.closest('[data-act]');
  if(!act) return;
  if(act.dataset.act==='toggle') toggleTask(id);
  else if(act.dataset.act==='edit') enterEdit(id);
  else if(act.dataset.act==='save'){
    const title=li.querySelector('.et').value, minutes=li.querySelector('.em').value;
    saveEdit(id,title,minutes);
  }
  else if(act.dataset.act==='cancel') render();
  else if(act.dataset.act==='del'){
    YaraModuleUI.requestDelete(act, {
      title:'删除这条工作任务？',
      message:'删除后会同步到 Web 与手机端，且不会保留在当天任务中。',
      confirmText:'确认删除'
    }, function(){ delTask(id); });
  }
});

// 编辑态键盘：Enter 保存 / Esc 取消
document.getElementById('taskList').addEventListener('keydown', e=>{
  const li=e.target.closest('.task.editing');
  if(!li) return;
  if(e.key==='Enter'){ e.preventDefault(); const id=li.dataset.id; saveEdit(id, li.querySelector('.et').value, li.querySelector('.em').value); }
  else if(e.key==='Escape'){ render(); }
});

window.addEventListener('storage', function(event){
  if(event.key!==LS_KEY) return;
  state=load();
  render();
  setSyncStatus(SB_CONFIG.ready?'online':'local', SB_CONFIG.ready?'已同步当前浏览器的最新进度':'本机数据已更新');
});

// ===== INIT =====
render();
initCloud();
</script>
<script id="yaraSystemBridge" src="../yara-system-bridge.js?v=1.5"></script>
</body>
</html>
