<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17211e">
  <title>Lysie · 暂时离线</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Avenir Next","SF Pro Display","PingFang SC",sans-serif;color:#f2f5f3;background:radial-gradient(circle at 10% 10%,rgba(230,160,130,.16),transparent 42%),radial-gradient(circle at 90% 85%,rgba(172,160,201,.15),transparent 46%),#17211e}.card{width:min(440px,100%);padding:32px 28px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(32,44,40,.9);box-shadow:0 26px 80px rgba(3,10,7,.4);backdrop-filter:blur(18px);text-align:center}.plant{font-size:3.6rem;filter:drop-shadow(0 10px 20px rgba(120,183,164,.2))}h1{font-size:1.35rem;margin:16px 0 9px}p{margin:0;color:#b7c2bc;font-size:.86rem;line-height:1.8}.actions{display:flex;justify-content:center;gap:10px;margin-top:24px}button,a{min-height:44px;padding:0 17px;border-radius:14px;font:inherit;font-size:.8rem;font-weight:750;cursor:pointer}button{border:0;color:#14231e;background:linear-gradient(135deg,#91c8b7,#78b7a4)}a{display:inline-flex;align-items:center;text-decoration:none;border:1px solid rgba(255,255,255,.14);color:#f2f5f3;background:rgba(255,255,255,.06)}small{display:block;margin-top:18px;color:#8f9d96;line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <div class="plant" aria-hidden="true">🌱</div>
    <h1>网络暂时走神了</h1>
    <p>已缓存的页面仍可继续使用；云端同步会在网络恢复后重新连接。你的本地数据不会因为这个页面被修改。</p>
    <div class="actions"><button type="button" onclick="location.reload()">重新连接</button><a href="管理系统.html">返回首页</a></div>
    <small>如果某个模块尚未在这台设备上打开过，它可能需要联网后才能首次加载。</small>
  </main>
</body>
</html>
